  <rect x="4.09" y="4.09" width="0.82" height="0.82" />
  <rect x="5.09" y="4.09" width="0.82" height="0.82" />
  <rect x="6.09" y="4.09" width="0.82" height="0.82" />
  <rect x="7.09" y="4.09" width="0.82" height="0.82" />
  <rect x="8.09" y="4.09" width="0.82" height="0.82" />
  <rect x="9.09" y="4.09" width="0.82" height="0.82" />

  <!-- Full lower crumb -->
  <rect x="0.09" y="5.09" width="0.82" height="0.82" />
