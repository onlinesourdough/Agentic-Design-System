<!doctype html>
<html lang="da" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Crypto Club Classroom-lektion med video, noter og modulnavigation."
    />
    <link rel="icon" href="assets/favicon-32x32.png" />
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/classroom.css" />
    <title>Tokenomics — Crypto Club Classroom</title>
  </head>
  <body data-page="classroom" class="lesson-page">
    <div class="app" id="app-shell"></div>
    <script src="assets/mock-data.js?v=20260713"></script>
    <script src="assets/app.js?v=20260713"></script>
    <script>
      const UI = CryptoClubUI;
      UI.mountShell();
      UI.bindShell();
      const modules = [
        {
          n: "01",
          title: "Introduktion",
          lessons: ["Hvorfor en fast metode?", "Sådan bruger du frameworket"],
          done: true,
        },
        {
          n: "02",
          title: "Vision & problem",
          lessons: ["Problemets størrelse", "Produktets nødvendighed"],
          done: true,
        },
        {
          n: "03",
          title: "Tokenomics",
          lessons: [
            "Forsyning og emission",
            "Incitamenter og unlocks",
            "Øvelse: vurder et token",
          ],
          active: true,
        },
        {
          n: "04",
          title: "Team & execution",
          lessons: ["Track record", "Governance og transparens"],
        },
        {
          n: "05",
          title: "Cash flow",
          lessons: ["Protokolindtjening", "Afsluttende case"],
        },
      ];

      document.getElementById("page-content").innerHTML = `
        <header class="lesson-topbar"><a href="classroom.html">← Tilbage til Classroom</a><span>4-trins analyseframework</span><button class="icon-btn mobile-menu" id="lessonMobileMenu" type="button" aria-label="Åbn navigation">${UI.icons.menu}</button></header>
        <div class="lesson-layout">
          <aside class="lesson-modules"><div><p class="eyebrow">Kursusindhold</p><strong>6 af 10 lektioner</strong><div class="progress"><span style="width:60%"></span></div></div>${modules.map((module) => `<section class="lesson-module${module.active ? " is-active" : ""}"><button type="button" aria-expanded="${module.active ? "true" : "false"}"><span>${module.done ? "✓" : module.n}</span><strong>${module.title}</strong><em>${module.active ? "−" : "+"}</em></button><div>${module.lessons.map((lesson, index) => `<a class="${module.active && index === 1 ? "is-current" : ""}" href="#">${module.done || (module.active && index === 0) ? "✓" : "○"}<span>${lesson}</span>${module.active && index === 1 ? "<small>12 min.</small>" : ""}</a>`).join("")}</div></section>`).join("")}</aside>
          <main class="lesson-content">
            <div class="lesson-video" role="img" aria-label="Video: Sådan vurderer du tokenomics"><div class="video-grid"></div><span>CRYPTO CLUB · CLASSROOM</span><h1>Sådan vurderer du<br/>tokenomics</h1><button type="button" id="playLesson" aria-label="Afspil video">▶</button><div class="video-controls"><i style="width:32%"></i><small>03:52 / 12:08</small><em>HD · ⚙</em></div></div>
            <article class="lesson-article"><div class="lesson-title"><div><p class="eyebrow">Modul 3 · Lektion 2</p><h1>Sådan vurderer du tokenomics</h1><p>Tokenomics beskriver, hvordan et tokens forsyning, fordeling og incitamenter påvirker værdien over tid.</p></div><button class="btn btn-ghost" type="button" id="completeLesson">Markér som færdig</button></div>
              <nav class="lesson-tabs" aria-label="Lektionsindhold"><button class="is-active" data-lesson-tab="notes">Lektionsnoter</button><button data-lesson-tab="transcript">Transskription</button><button data-lesson-tab="resources">Ressourcer</button></nav>
              <section data-lesson-panel="notes"><h2>De fire spørgsmål</h2><p>En token-model bliver først interessant, når du kan forklare, hvem der har brug for tokenet, hvor nyt udbud kommer fra, og hvorfor efterspørgslen kan vokse hurtigere end forsyningen.</p><div class="lesson-callout"><strong>Huskeregel</strong><p>Høj aktivitet er ikke det samme som bæredygtig værdi. Undersøg altid emission, unlocks og reel anvendelse samlet.</p></div><ol><li><strong>Forsyning:</strong> Hvor mange tokens findes nu og maksimalt?</li><li><strong>Fordeling:</strong> Hvor stor en andel kontrolleres af team og tidlige investorer?</li><li><strong>Incitament:</strong> Hvem modtager nye tokens — og hvorfor?</li><li><strong>Efterspørgsel:</strong> Skaber produktet et reelt behov for tokenet?</li></ol></section>
              <section data-lesson-panel="transcript" hidden><h2>Transskription</h2><p><strong>00:00</strong> I denne lektion ser vi på de mekanismer, der bestemmer et tokens langsigtede udbud og efterspørgsel.</p><p><strong>02:14</strong> Start ikke med prisen. Start med forsyningsplanen, unlocks og hvem der modtager nye tokens.</p></section>
              <section data-lesson-panel="resources" hidden><h2>Ressourcer</h2><a class="resource-row" href="#" data-demo="Worksheet-download er en preview-handling"><span>PDF</span><div><strong>Tokenomics worksheet</strong><small>8 spørgsmål · 2 sider</small></div>${UI.icons.arrow}</a><a class="resource-row" href="https://app.cryptoclub.dk" target="_blank" rel="noopener"><span>AI</span><div><strong>Analysér et token med AI Matthæus</strong><small>Åbner AI Matthæus</small></div>${UI.icons.external}</a></section>
            </article>
            <footer class="lesson-next"><span><small>Næste lektion</small><strong>Øvelse: vurder et token</strong></span><button class="btn btn-primary" type="button" data-demo="Næste lektion åbnes i den færdige Classroom-app">Næste lektion ${UI.icons.arrow}</button></footer>
          </main>
        </div>`;

      document.querySelectorAll(".lesson-module > button").forEach((button) =>
        button.addEventListener("click", () => {
          const module = button.closest(".lesson-module");
          const open = module.classList.toggle("is-active");
          button.setAttribute("aria-expanded", String(open));
          button.querySelector("em").textContent = open ? "−" : "+";
        }),
      );
      document.querySelectorAll("[data-lesson-tab]").forEach((button) =>
        button.addEventListener("click", () => {
          document
            .querySelectorAll("[data-lesson-tab]")
            .forEach((item) =>
              item.classList.toggle("is-active", item === button),
            );
          document
            .querySelectorAll("[data-lesson-panel]")
            .forEach(
              (panel) =>
                (panel.hidden =
                  panel.dataset.lessonPanel !== button.dataset.lessonTab),
            );
        }),
      );
      document
        .getElementById("playLesson")
        ?.addEventListener("click", () =>
          UI.showToast("Videoafspilleren er en interaktiv preview"),
        );
      document
        .getElementById("completeLesson")
        ?.addEventListener("click", (event) => {
          event.currentTarget.textContent = "✓ Lektion færdig";
          event.currentTarget.classList.add("is-complete");
        });
      document
        .getElementById("lessonMobileMenu")
        ?.addEventListener("click", () =>
          document.querySelector(".sidebar")?.classList.toggle("is-open"),
        );
      UI.bindDemoActions(document.getElementById("page-content"));
    </script>
  </body>
</html>
