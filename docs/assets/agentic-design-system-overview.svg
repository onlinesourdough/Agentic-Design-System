<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Design System route</title>
  <desc id="desc">Prior run evidence enters the workspace, moves through preview and review, is recorded in a small ledger, and is promoted into the curated gallery only by deliberate choice.</desc>
  <rect width="1600" height="760" rx="42" fill="#f5f1e8"/>
  <path d="M90 128H1510" stroke="#d7d2c7" stroke-width="2" stroke-dasharray="7 12"/>
  <text x="90" y="84" fill="#5c6868" font-family="ui-monospace,monospace" font-size="22" letter-spacing="3">AGENTIC DESIGN SYSTEM · PERSISTENT ROUTE</text>
  <text x="90" y="190" fill="#1d282b" font-family="ui-sans-serif,system-ui" font-size="66" font-weight="750" letter-spacing="-3">Make the next design decision visible.</text>
  <g font-family="ui-sans-serif,system-ui">
    <g transform="translate(90 280)"><rect width="235" height="210" rx="22" fill="#fffdf7" stroke="#d7d2c7" stroke-width="2"/><text x="28" y="48" fill="#a94c32" font-size="18" font-weight="700">01 · HISTORY</text><text x="28" y="101" fill="#1d282b" font-size="31" font-weight="700">Inspect</text><text x="28" y="138" fill="#5c6868" font-size="19">Prior runs, learning</text><text x="28" y="166" fill="#5c6868" font-size="19">and active state.</text></g>
    <g transform="translate(385 280)"><rect width="235" height="210" rx="22" fill="#fffdf7" stroke="#d7d2c7" stroke-width="2"/><text x="28" y="48" fill="#a94c32" font-size="18" font-weight="700">02 · WORKSPACE</text><text x="28" y="101" fill="#1d282b" font-size="31" font-weight="700">Resume</text><text x="28" y="138" fill="#5c6868" font-size="19">Brief, direction,</text><text x="28" y="166" fill="#5c6868" font-size="19">and current state.</text></g>
    <g transform="translate(680 280)"><rect width="235" height="210" rx="22" fill="#fffdf7" stroke="#d7d2c7" stroke-width="2"/><text x="28" y="48" fill="#a94c32" font-size="18" font-weight="700">03 · REVIEW</text><text x="28" y="101" fill="#1d282b" font-size="31" font-weight="700">See it</text><text x="28" y="138" fill="#5c6868" font-size="19">Browser, mobile,</text><text x="28" y="166" fill="#5c6868" font-size="19">states and focus.</text></g>
    <g transform="translate(975 280)"><rect width="235" height="210" rx="22" fill="#fffdf7" stroke="#d7d2c7" stroke-width="2"/><text x="28" y="48" fill="#a94c32" font-size="18" font-weight="700">04 · LEDGER</text><text x="28" y="101" fill="#1d282b" font-size="31" font-weight="700">Relate</text><text x="28" y="138" fill="#5c6868" font-size="19">Output, proof,</text><text x="28" y="166" fill="#5c6868" font-size="19">failure and recovery.</text></g>
    <g transform="translate(1270 280)"><rect width="240" height="210" rx="22" fill="#173d45"/><text x="28" y="48" fill="#f1a17e" font-size="18" font-weight="700">05 · GALLERY</text><text x="28" y="101" fill="#fffdf7" font-size="31" font-weight="700">Curate</text><text x="28" y="138" fill="#c7d5d1" font-size="19">Only deliberate</text><text x="28" y="166" fill="#c7d5d1" font-size="19">examples become durable.</text></g>
  </g>
  <g fill="none" stroke="#d06b45" stroke-width="4" stroke-linecap="round"><path d="M326 385H374"/><path d="M621 385H669"/><path d="M916 385H964"/><path d="M1211 385H1259"/></g>
  <g fill="#d06b45"><path d="m374 385-13-8v16z"/><path d="m669 385-13-8v16z"/><path d="m964 385-13-8v16z"/><path d="m1259 385-13-8v16z"/></g>
  <path d="M1390 510V595H510" fill="none" stroke="#173d45" stroke-width="3" stroke-linecap="round"/>
  <path d="m510 595 14-9v18z" fill="#173d45"/>
  <rect x="90" y="555" width="420" height="90" rx="18" fill="#dbe8e5"/>
  <text x="118" y="593" fill="#173d45" font-family="ui-sans-serif,system-ui" font-size="18" font-weight="700">STANDALONE BY DEFAULT</text>
  <text x="118" y="624" fill="#173d45" font-family="ui-sans-serif,system-ui" font-size="23">Ordinary paths and proof return.</text>
  <text x="90" y="708" fill="#5c6868" font-family="ui-sans-serif,system-ui" font-size="20">The gallery is durable. Branches and worktrees are temporary isolation.</text>
</svg>
