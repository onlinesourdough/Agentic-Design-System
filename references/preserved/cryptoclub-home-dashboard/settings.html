<!doctype html>
<html lang="da" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Crypto Club profil og indstillinger." />
    <link rel="icon" href="assets/favicon-32x32.png" />
    <link rel="stylesheet" href="assets/app.css" />
    <link rel="stylesheet" href="assets/settings.css" />
    <title>Profil & indstillinger — Crypto Club</title>
  </head>
  <body data-page="settings">
    <div class="app" id="app-shell"></div>
    <script src="assets/mock-data.js?v=20260713"></script>
    <script src="assets/app.js?v=20260713"></script>
    <script>
      const UI = CryptoClubUI;
      UI.mountShell();
      UI.bindShell();

      document.getElementById("page-content").innerHTML = `
        <header class="settings-head"><div><p class="eyebrow">Konto</p><h1>Profil &amp; indstillinger</h1><p>Administrér din profil, medlemsoplevelse og sikkerhed.</p></div><button class="icon-btn mobile-menu" id="settingsMobileMenu" type="button" aria-label="Åbn navigation">${UI.icons.menu}</button></header>
        <div class="settings-layout">
          <nav class="settings-nav" aria-label="Indstillinger"><button class="is-active" data-settings-tab="profile">${UI.icons.user}<span><strong>Profil</strong><small>Personlige oplysninger</small></span></button><button data-settings-tab="preferences">${UI.icons.settings}<span><strong>Præferencer</strong><small>Visning og notifikationer</small></span></button><button data-settings-tab="security">${UI.icons.settings}<span><strong>Sikkerhed</strong><small>Login og sessioner</small></span></button></nav>

          <main class="settings-content">
            <section data-settings-panel="profile">
              <div class="settings-section-head"><div><h2>Din profil</h2><p>De oplysninger, andre medlemmer kan se.</p></div><span class="member-pill">Inner Circle medlem</span></div>
              <div class="profile-editor"><span class="profile-avatar xlarge" aria-hidden="true">👤</span><div><strong>Profilikon</strong><p>Previewet bruger et neutralt ikon. I produktion kan medlemmet vælge et billede.</p></div><button class="btn btn-ghost" type="button" data-demo="Valg af profilbillede er ikke aktivt i previewet">Skift ikon</button></div>
              <form class="settings-form" id="profileForm"><label><span>Visningsnavn</span><input name="name" value="Test bruger" /></label><label><span>E-mail</span><input name="email" type="email" value="test@cryptoclub.dk" /></label><label class="full"><span>Kort bio</span><textarea rows="3">Inner Circle-medlem med fokus på langsigtet analyse og risikostyring.</textarea><small>Vises på din fællesskabsprofil.</small></label><div class="form-actions full"><button class="btn btn-primary" type="submit">Gem ændringer</button></div></form>
            </section>

            <section data-settings-panel="preferences" hidden>
              <div class="settings-section-head"><div><h2>Præferencer</h2><p>Tilpas hvordan Crypto Club holder dig opdateret.</p></div></div>
              <div class="preference-list"><label><span><strong>Algo-signaler</strong><small>Få besked ved nye køb- eller salgssignaler.</small></span><input type="checkbox" checked/><i></i></label><label><span><strong>Heatmap-opdateringer</strong><small>Daglige scores for de markeder, du følger.</small></span><input type="checkbox" checked/><i></i></label><label><span><strong>Classroom-påmindelser</strong><small>Påmindelser om lektioner og live-sessioner.</small></span><input type="checkbox"/><i></i></label><label><span><strong>Ugentlig opsummering</strong><small>Én samlet mail med marked, læring og aktivitet.</small></span><input type="checkbox" checked/><i></i></label></div>
              <div class="settings-row"><div><strong>Standardstartside</strong><small>Vælg hvor du lander efter login.</small></div><select><option>Dashboard</option><option>Market Intelligence</option><option>Classroom</option><option>Chat</option></select></div>
            </section>

            <section data-settings-panel="security" hidden>
              <div class="settings-section-head"><div><h2>Sikkerhed</h2><p>Din konto bruger fælles login på tværs af Crypto Club.</p></div><span class="secure-state"><i></i> Beskyttet</span></div>
              <div class="security-card"><span>${UI.icons.settings}</span><div><strong>Single Sign-On</strong><p>Én sikker session til Home, AI Matthæus og fremtidige apps.</p></div><em>Aktiv</em></div><div class="settings-row"><div><strong>Adgangskode</strong><small>Senest ændret for 42 dage siden.</small></div><button class="btn btn-ghost" data-demo="Adgangskode-flowet åbnes i den færdige app">Skift adgangskode</button></div><div class="settings-row"><div><strong>Aktive sessioner</strong><small>Mac · København · aktiv nu</small></div><button class="btn btn-ghost" data-demo="Sessionsoversigten åbnes i den færdige app">Administrér</button></div>
            </section>
          </main>
        </div>`;

      function openSettingsTab(id) {
        document
          .querySelectorAll("[data-settings-tab]")
          .forEach((button) =>
            button.classList.toggle(
              "is-active",
              button.dataset.settingsTab === id,
            ),
          );
        document
          .querySelectorAll("[data-settings-panel]")
          .forEach(
            (panel) => (panel.hidden = panel.dataset.settingsPanel !== id),
          );
        history.replaceState(null, "", `#${id}`);
      }
      document
        .querySelectorAll("[data-settings-tab]")
        .forEach((button) =>
          button.addEventListener("click", () =>
            openSettingsTab(button.dataset.settingsTab),
          ),
        );
      document
        .getElementById("profileForm")
        ?.addEventListener("submit", (event) => {
          event.preventDefault();
          UI.showToast("Profilen er gemt i previewet");
        });
      document
        .getElementById("settingsMobileMenu")
        ?.addEventListener("click", () =>
          document.querySelector(".sidebar")?.classList.toggle("is-open"),
        );
      UI.bindDemoActions(document.getElementById("page-content"));
      const initial = location.hash.replace("#", "");
      if (["profile", "preferences", "security"].includes(initial))
        openSettingsTab(initial);
    </script>
  </body>
</html>
