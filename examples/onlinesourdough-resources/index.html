<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A static design preview for the resources.onlinesourdough decision library."
    />
    <title>Resources — onlinesourdough</title>
    <link rel="stylesheet" href="assets/adapters/heroui-disclosure.css" />
    <style>
      @font-face {
        font-family: "Geist Sans";
        src: url("assets/fonts/geist-sans-variable.woff2") format("woff2");
        font-display: swap;
        font-style: normal;
        font-weight: 100 900;
      }

      @font-face {
        font-family: "Geist Mono";
        src: url("assets/fonts/geist-mono-variable.woff2") format("woff2");
        font-display: swap;
        font-style: normal;
        font-weight: 100 900;
      }

      @font-face {
        font-family: "Geist Pixel";
        src: url("assets/fonts/geist-pixel-square.woff2") format("woff2");
        font-display: swap;
        font-style: normal;
        font-weight: 400;
      }

      :root {
        color-scheme: light;
        --bg: #f8f2e8;
        --surface: #fffaf1;
        --surface-soft: #f1eadf;
        --paper: #fffdf7;
        --text: #2b1b12;
        --muted: #806c5c;
        --line: #e5d7c6;
        --line-strong: #d4bd9f;
        --accent: #b86f36;
        --accent-dark: #663715;
        --focus: #2b6f98;
        --success: #3b6f55;
        --error: #9f3e2c;
        --folder-one: #5a3d30;
        --folder-two: #624333;
        --folder-three: #694938;
        --folder-four: #56392d;
        --folder-hover: #795541;
        --folder-ink: #fffaf1;
        --shadow: rgba(70, 39, 20, 0.12);
        --shadow-soft: rgba(70, 39, 20, 0.06);
        --font-sans:
          "Geist Sans", Arial, Helvetica, ui-sans-serif, system-ui, sans-serif;
        --font-mono: "Geist Mono", SFMono-Regular, Consolas, monospace;
        --font-pixel: "Geist Pixel", "Geist Mono", monospace;
        --sidebar-width: 250px;
        --sidebar-collapsed-width: 0px;
        --topbar-height: 62px;
        --content-width: 1180px;
        --reading-width: 720px;
        --reading-track-reserve: 268px;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #18120e;
        --surface: #221813;
        --surface-soft: #2a1e17;
        --paper: #302219;
        --text: #fff2df;
        --muted: #c6ad94;
        --line: #3c2b21;
        --line-strong: #69462d;
        --accent: #d58a48;
        --accent-dark: #f0c48a;
        --focus: #6db8df;
        --success: #8bc29d;
        --error: #f09a83;
        --folder-one: #80583e;
        --folder-two: #885c42;
        --folder-three: #7a503a;
        --folder-four: #76503b;
        --folder-hover: #8e6043;
        --folder-ink: #fff2df;
        --shadow: rgba(0, 0, 0, 0.32);
        --shadow-soft: rgba(0, 0, 0, 0.2);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        min-height: 100dvh;
        margin: 0;
        overflow-x: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input,
      textarea {
        color: inherit;
        font: inherit;
      }

      button {
        border: 0;
      }

      [hidden] {
        display: none !important;
      }

      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }

      .skip-link {
        position: fixed;
        z-index: 100;
        top: 12px;
        left: 12px;
        transform: translateY(-160%);
        border-radius: 6px;
        background: var(--text);
        color: var(--bg);
        font-size: 13px;
        font-weight: 700;
        padding: 9px 12px;
        transition: transform 150ms ease;
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      #main-content:focus-visible {
        outline: none;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .site-shell {
        display: grid;
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
        min-height: 100dvh;
        transition: grid-template-columns 180ms ease;
      }

      .site-shell.sidebar-collapsed {
        grid-template-columns: var(--sidebar-collapsed-width) minmax(0, 1fr);
      }

      .sidebar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        min-width: 0;
        height: 100dvh;
        flex-direction: column;
        overflow: hidden;
        border-right: 1px solid var(--line);
        background: var(--surface);
      }

      .site-shell.sidebar-collapsed .sidebar {
        width: 0;
        border-right: 0;
        pointer-events: none;
        visibility: hidden;
      }

      .sidebar-header {
        display: flex;
        min-height: var(--topbar-height);
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px solid var(--line);
        padding: 9px 12px;
      }

      .brand {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 9px;
      }

      .brand-mark {
        width: 29px;
        height: 29px;
        flex: 0 0 auto;
        object-fit: contain;
      }

      .brand-copy {
        display: block;
        min-width: 0;
      }

      .brand-name {
        overflow: hidden;
        color: var(--text);
        font-family: var(--font-pixel);
        font-size: 15px;
        letter-spacing: -0.04em;
        line-height: 1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .brand-suffix {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 9px;
        line-height: 1;
      }

      .icon-button,
      .mobile-menu-button {
        display: inline-flex;
        width: 34px;
        height: 34px;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .icon-button:hover,
      .icon-button:focus-visible,
      .mobile-menu-button:hover,
      .mobile-menu-button:focus-visible {
        background: var(--surface-soft);
        color: var(--text);
      }

      .icon-button svg,
      .mobile-menu-button svg,
      .topbar-nav-button svg,
      .topbar-action svg,
      .nav-icon svg,
      .route-arrow svg,
      .folder-arrow svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      .sidebar-nav {
        min-height: 0;
        flex: 1;
        overflow-y: auto;
        padding: 17px 10px 18px;
      }

      .nav-section + .nav-section {
        margin-top: 20px;
      }

      .nav-section-heading {
        display: flex;
        width: 100%;
        min-height: 31px;
        align-items: center;
        margin: 0;
        color: var(--text);
        font-size: 13px;
        font-weight: 690;
        text-align: left;
        padding: 0 8px;
      }

      .nav-section-heading + .nav-list {
        margin-top: 4px;
      }

      .nav-list {
        display: grid;
        gap: 2px;
        margin-top: 4px;
      }

      .nav-child,
      .nav-utility {
        display: flex;
        min-width: 0;
        min-height: 31px;
        align-items: center;
        gap: 8px;
        border-radius: 7px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 560;
        line-height: 1.25;
        padding: 0 8px 0 15px;
      }

      .nav-disclosure {
        display: grid;
        gap: 2px;
      }

      .nav-disclosure-button {
        display: flex;
        width: 100%;
        min-width: 0;
        min-height: 31px;
        align-items: center;
        gap: 8px;
        border-radius: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        font-weight: 560;
        line-height: 1.25;
        padding: 0 8px 0 15px;
        text-align: left;
      }

      .nav-disclosure-button:hover {
        color: var(--text);
      }

      .nav-disclosure-button:focus-visible {
        color: var(--text);
      }

      .nav-disclosure-glyph {
        display: inline-flex;
        width: 15px;
        height: 15px;
        flex: 0 0 15px;
        align-items: center;
        justify-content: center;
        margin-left: auto;
        color: currentColor;
      }

      .nav-disclosure-glyph svg {
        width: 13px;
        height: 13px;
      }

      .nav-sublist {
        display: grid;
        gap: 2px;
        margin: 0 0 2px;
        padding-left: 10px;
      }

      .nav-subchild {
        min-height: 29px;
        padding-left: 17px;
        font-size: 11px;
        font-weight: 520;
      }

      .nav-subchild.is-active {
        font-weight: 680;
      }

      .nav-child:hover,
      .nav-child:focus-visible,
      .nav-child.is-active,
      .nav-utility:hover,
      .nav-utility:focus-visible,
      .nav-utility.is-active {
        background: var(--surface-soft);
        color: var(--text);
      }

      .nav-child.is-active,
      .nav-utility.is-active {
        font-weight: 700;
      }

      .nav-child-label,
      .nav-utility-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .nav-external-icon {
        display: inline-flex;
        width: 15px;
        height: 15px;
        flex: 0 0 15px;
        align-items: center;
        justify-content: center;
        margin-left: auto;
        color: currentColor;
      }

      .nav-external-icon svg {
        width: 13px;
        height: 13px;
      }

      .nav-icon {
        display: inline-flex;
        width: 18px;
        flex: 0 0 18px;
        align-items: center;
        justify-content: center;
        color: currentColor;
      }

      .nav-icon svg {
        width: 15px;
        height: 15px;
      }

      .sidebar-bottom {
        display: grid;
        gap: 2px;
        margin-top: auto;
        border-top: 1px solid var(--line);
        padding: 12px 10px 15px;
      }

      .site-main {
        --reading-track-width: min(
          var(--reading-width),
          calc(100vw - var(--sidebar-width) - var(--reading-track-reserve))
        );
        min-width: 0;
        min-height: 100dvh;
        background:
          linear-gradient(rgba(116, 88, 65, 0.027) 1px, transparent 1px),
          linear-gradient(90deg, rgba(116, 88, 65, 0.027) 1px, transparent 1px),
          var(--bg);
        background-size: 52px 52px;
      }

      .site-shell.sidebar-collapsed .site-main {
        --reading-track-width: min(
          var(--reading-width),
          calc(
            100vw - var(--sidebar-collapsed-width) -
              var(--reading-track-reserve)
          )
        );
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: grid;
        grid-template-columns: minmax(0, 1fr) var(--reading-track-width) minmax(
            0,
            1fr
          );
        min-height: var(--topbar-height);
        align-items: center;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 94%, transparent);
        padding: 0 clamp(8px, 1.4vw, 18px);
        backdrop-filter: blur(10px);
      }

      .mobile-menu-button {
        display: none;
      }

      .topbar-left {
        display: flex;
        align-items: center;
        gap: 6px;
        grid-column: 1;
        justify-self: start;
      }

      .topbar-nav-button {
        display: inline-flex;
        width: 40px;
        height: 40px;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
      }

      .topbar-nav-button:hover,
      .topbar-nav-button:focus-visible {
        background: var(--surface-soft);
        color: var(--text);
      }

      .topbar-nav-button:disabled {
        cursor: default;
        opacity: 0.52;
      }

      .topbar-nav-button:disabled:hover {
        background: transparent;
        color: var(--text);
      }

      .topbar-nav-button svg {
        width: 22px;
        height: 22px;
        stroke-width: 1.9;
      }

      .topbar-route {
        display: inline-flex;
        width: 100%;
        min-width: 0;
        align-items: center;
        gap: 8px;
        grid-column: 2;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .topbar-route strong {
        overflow: hidden;
        color: var(--text);
        font-weight: 560;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .topbar-actions {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 4px;
        grid-column: 3;
        justify-self: end;
        margin-left: auto;
      }

      .topbar-action {
        display: inline-flex;
        width: 40px;
        height: 40px;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        padding: 0;
      }

      .topbar-action:hover,
      .topbar-action:focus-visible,
      .topbar-action.is-active {
        background: var(--surface-soft);
        color: var(--text);
      }

      .theme-toggle-icon {
        display: block;
        width: 17px;
        height: 17px;
        border-radius: 999px;
        box-shadow: inset -6px -4px 0 0 currentColor;
      }

      :root[data-theme="dark"] .theme-toggle-icon {
        background: currentColor;
        box-shadow:
          0 -8px 0 -6px currentColor,
          0 8px 0 -6px currentColor,
          8px 0 0 -6px currentColor,
          -8px 0 0 -6px currentColor,
          6px 6px 0 -6px currentColor,
          -6px -6px 0 -6px currentColor,
          6px -6px 0 -6px currentColor,
          -6px 6px 0 -6px currentColor;
      }

      .page {
        width: min(calc(100% - 64px), 1120px);
        margin: 0 auto;
        padding: 48px 0 72px;
      }

      .reading-track {
        width: min(var(--reading-track-width), 100%);
        margin-inline: auto;
      }

      .page-kicker,
      .section-kicker,
      .list-meta,
      .route-label,
      .utility-label {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 550;
        letter-spacing: 0.07em;
        line-height: 1.3;
        text-transform: uppercase;
      }

      .home-hero {
        position: relative;
        display: grid;
        justify-items: center;
        overflow: visible;
        background: transparent;
      }

      .vsl-intro {
        width: min(720px, 100%);
        display: grid;
        justify-items: center;
        padding: 4px 0 27px;
        text-align: center;
      }

      .vsl-intro h1 {
        max-width: 720px;
        margin: 0;
        color: var(--text);
        font-family: var(--font-pixel);
        font-size: clamp(40px, 5vw, 58px);
        font-weight: 400;
        letter-spacing: -0.035em;
        line-height: 1.02;
      }

      .vsl-intro p {
        max-width: 610px;
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.58;
      }

      .vsl-frame {
        width: min(820px, 100%);
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: var(--paper);
        box-shadow: 0 14px 30px var(--shadow-soft);
      }

      .vsl-chrome {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr) auto;
        min-height: 38px;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 0.055em;
        padding: 0 14px;
        text-transform: uppercase;
      }

      .vsl-dots {
        display: flex;
        gap: 5px;
      }

      .vsl-dots i {
        width: 7px;
        height: 7px;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        background: var(--surface-soft);
      }

      .vsl-window-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .vsl-duration {
        color: var(--accent-dark);
      }

      .vsl-screen {
        position: relative;
        display: grid;
        place-items: center;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        isolation: isolate;
        background: var(--surface-soft);
      }

      .vsl-video {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        filter: saturate(0.86) contrast(0.97);
      }

      .vsl-screen::after {
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(
            180deg,
            color-mix(in srgb, var(--bg) 8%, transparent),
            color-mix(in srgb, var(--bg) 34%, transparent)
          ),
          linear-gradient(
            90deg,
            color-mix(in srgb, var(--bg) 42%, transparent),
            transparent 42%,
            color-mix(in srgb, var(--bg) 20%, transparent)
          );
        content: "";
        transition: opacity 180ms ease;
      }

      .vsl-screen-copy {
        position: relative;
        z-index: 2;
        width: min(490px, calc(100% - 44px));
        display: grid;
        justify-items: center;
        color: var(--text);
        text-align: center;
        text-shadow: 0 1px 12px color-mix(in srgb, var(--bg) 35%, transparent);
        transition:
          opacity 180ms ease,
          visibility 180ms ease;
      }

      .vsl-screen-copy strong {
        margin-top: 12px;
        font-family: var(--font-pixel);
        font-size: clamp(25px, 4vw, 39px);
        font-weight: 400;
        letter-spacing: -0.035em;
        line-height: 1.03;
      }

      .vsl-screen-copy p {
        max-width: 420px;
        margin: 11px 0 0;
        color: color-mix(in srgb, var(--text) 82%, transparent);
        font-size: 13px;
        line-height: 1.45;
      }

      .vsl-play {
        position: relative;
        z-index: 3;
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        gap: 9px;
        margin-top: 20px;
        border: 1px solid
          color-mix(in srgb, var(--line-strong) 90%, transparent);
        border-radius: 8px;
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        box-shadow: 0 8px 16px var(--shadow-soft);
        color: var(--text);
        cursor: pointer;
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.035em;
        padding: 0 13px 0 11px;
        transition:
          background 160ms ease,
          color 160ms ease,
          box-shadow 160ms ease;
      }

      .vsl-play:hover,
      .vsl-play:focus-visible {
        background: var(--text);
        color: var(--bg);
        box-shadow: 0 10px 20px var(--shadow);
      }

      .vsl-play-glyph {
        width: 0;
        height: 0;
        border-top: 6px solid transparent;
        border-bottom: 6px solid transparent;
        border-left: 8px solid currentColor;
      }

      .vsl-frame.is-playing .vsl-screen::after,
      .vsl-frame.is-playing .vsl-screen-copy {
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
      }

      .page-header h1 {
        max-width: 780px;
        margin: 19px 0 0;
        color: var(--text);
        font-family: var(--font-pixel);
        font-size: clamp(38px, 5vw, 58px);
        font-weight: 400;
        letter-spacing: -0.035em;
        line-height: 1.02;
      }

      .page-header p {
        max-width: 690px;
        margin: 17px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.62;
      }

      :root[data-theme="dark"] .vsl-video {
        filter: brightness(0.72) saturate(0.82) contrast(0.98);
      }

      .page-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 18px;
        width: min(800px, 100%);
        margin: 25px auto 0;
      }

      .button-primary,
      .button-secondary,
      .text-link {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.2;
        padding: 0 14px;
      }

      .button-primary {
        background: var(--text);
        color: var(--bg);
      }

      .button-primary:hover,
      .button-primary:focus-visible {
        background: var(--accent-dark);
        color: var(--paper);
      }

      .button-secondary {
        border: 1px solid var(--line-strong);
        background: transparent;
        color: var(--text);
      }

      .button-secondary:hover,
      .button-secondary:focus-visible {
        background: var(--surface-soft);
      }

      .text-link {
        min-height: 32px;
        background: transparent;
        color: var(--accent-dark);
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.03em;
        padding: 0;
      }

      .text-link:hover,
      .text-link:focus-visible {
        color: var(--text);
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      .page-note {
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .folder-section {
        width: min(772px, 100%);
        margin: 30px auto 0;
      }

      .home-divider {
        height: 1px;
        margin-top: 34px;
        background: var(--line);
      }

      .section-heading {
        display: flex;
        min-height: 28px;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }

      .section-heading h2,
      .reading-panel h2,
      .route-section h2 {
        margin: 0;
        color: var(--text);
        font-size: 20px;
        letter-spacing: -0.025em;
        line-height: 1.16;
      }

      .section-heading p {
        max-width: 430px;
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        text-align: right;
      }

      .home-page .section-heading {
        border-top: 0;
        padding-top: 0;
      }

      .section-note {
        flex: 0 0 auto;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 10px;
        line-height: 1.3;
        white-space: nowrap;
      }

      .folder-stage {
        position: relative;
        isolation: isolate;
        margin-top: 30px;
        overflow: visible;
      }

      .folder-grid {
        position: relative;
        z-index: 2;
        display: grid;
        width: 100%;
        margin-inline: auto;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        column-gap: 60px;
        row-gap: 92px;
      }

      .folder-card {
        position: relative;
        display: block;
        min-width: 0;
        color: var(--text);
        touch-action: manipulation;
      }

      .folder-card:focus-visible {
        outline-offset: 5px;
      }

      .folder-visual {
        position: relative;
        display: block;
        height: 262px;
        isolation: isolate;
        overflow: visible;
      }

      .folder-papers {
        position: absolute;
        inset: 0;
        isolation: isolate;
        pointer-events: none;
      }

      .folder-paper,
      .folder-sheet {
        position: absolute;
        top: 30px;
        height: 216px;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 12px 12px 8px 8px;
        background:
          linear-gradient(
            135deg,
            color-mix(in srgb, var(--paper) 82%, white),
            transparent 42%
          ),
          repeating-linear-gradient(
            0deg,
            color-mix(in srgb, var(--line) 28%, transparent) 0 1px,
            transparent 1px 5px
          ),
          var(--paper);
        box-shadow: 0 8px 16px var(--shadow-soft);
        pointer-events: none;
      }

      .folder-paper::before,
      .folder-paper::after,
      .folder-sheet::before,
      .folder-sheet::after {
        position: absolute;
        content: "";
        pointer-events: none;
      }

      .folder-paper::before {
        top: 22px;
        right: 17px;
        left: 17px;
        height: 1px;
        background: var(--line);
        box-shadow: 0 10px 0 color-mix(in srgb, var(--line) 72%, transparent);
      }

      .folder-paper::after {
        top: 14px;
        left: 17px;
        width: 28px;
        height: 8px;
        border: 1px solid var(--line-strong);
        border-radius: 2px;
        opacity: 0.72;
      }

      .folder-paper {
        z-index: 1;
        opacity: 0.86;
        transition:
          transform 300ms cubic-bezier(0.23, 1, 0.32, 1),
          box-shadow 300ms ease;
      }

      .folder-paper-back {
        right: 46px;
        left: 20px;
        background: color-mix(in srgb, var(--paper) 87%, var(--surface-soft));
        transform: translateY(0) rotate(var(--paper-back-tilt));
      }

      .folder-paper-mid {
        top: 38px;
        right: 20px;
        left: 38px;
        z-index: 2;
        opacity: 0.94;
        transform: translateY(0) rotate(var(--paper-mid-tilt));
      }

      .folder-sheet {
        right: 29px;
        left: 29px;
        z-index: 3;
        transition:
          transform 300ms cubic-bezier(0.23, 1, 0.32, 1),
          box-shadow 300ms ease;
        transform: translateY(0) rotate(var(--sheet-tilt));
      }

      .folder-sheet::before {
        top: 78px;
        right: 14px;
        left: 14px;
        height: 1px;
        background: var(--line);
      }

      .folder-sheet::after {
        top: 104px;
        right: 34%;
        left: 14px;
        height: 1px;
        background: var(--line);
      }

      .folder-sheet-topline {
        position: absolute;
        top: 18px;
        right: 16px;
        left: 16px;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 0.06em;
        opacity: 0.92;
        text-transform: uppercase;
        transition: opacity 300ms ease;
      }

      .folder-sheet-title {
        position: absolute;
        top: 43px;
        right: 16px;
        left: 16px;
        color: var(--text);
        font-size: 16px;
        font-weight: 680;
        letter-spacing: -0.02em;
        line-height: 1.15;
        opacity: 0.85;
        transition: opacity 300ms ease;
      }

      .folder-sheet-copy {
        position: absolute;
        top: 69px;
        right: 16px;
        left: 16px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.42;
        opacity: 0.78;
        transition: opacity 300ms ease;
      }

      .folder-front {
        position: absolute;
        z-index: 4;
        top: 86px;
        right: 4px;
        bottom: 14px;
        left: 4px;
        display: grid;
        align-content: start;
        gap: 8px;
        overflow: hidden;
        border: 1px solid
          color-mix(in srgb, var(--accent-dark) 65%, var(--line));
        border-radius: 0 16px 10px 10px;
        background:
          linear-gradient(
            135deg,
            color-mix(in srgb, var(--folder-ink) 12%, transparent),
            transparent 35%
          ),
          radial-gradient(
            circle at 18% 18%,
            color-mix(in srgb, var(--folder-ink) 10%, transparent) 0 1px,
            transparent 1.5px 100%
          ),
          repeating-linear-gradient(
            0deg,
            color-mix(in srgb, var(--folder-ink) 4%, transparent) 0 1px,
            transparent 1px 5px
          ),
          var(--folder-color, var(--folder-one));
        color: var(--folder-ink);
        box-shadow:
          0 6px 0 color-mix(in srgb, var(--accent-dark) 46%, transparent),
          0 14px 20px var(--shadow-soft);
        padding: 28px 22px 17px;
        transition:
          background 180ms ease,
          box-shadow 180ms ease,
          transform 300ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      .folder-front::before {
        position: absolute;
        inset: 43px 0 0;
        border-top: 1px solid
          color-mix(in srgb, var(--folder-ink) 28%, transparent);
        border-radius: 0 0 10px 10px;
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--folder-ink) 6%, transparent),
          transparent 35%
        );
        box-shadow: inset 0 1px 0
          color-mix(in srgb, var(--accent-dark) 28%, transparent);
        content: "";
        pointer-events: none;
      }

      .folder-front::after {
        position: absolute;
        top: 11px;
        right: 17px;
        width: 28px;
        height: 8px;
        border-top: 1px solid
          color-mix(in srgb, var(--folder-ink) 32%, transparent);
        border-bottom: 1px solid
          color-mix(in srgb, var(--folder-ink) 18%, transparent);
        content: "";
        opacity: 0.85;
        pointer-events: none;
      }

      .folder-front > * {
        position: relative;
        z-index: 1;
      }

      .folder-pocket {
        position: absolute !important;
        z-index: 0 !important;
        inset: 43px 0 0;
        border-top: 1px solid
          color-mix(in srgb, var(--folder-ink) 28%, transparent);
        border-radius: 0 0 10px 10px;
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--folder-ink) 6%, transparent),
          transparent 38%
        );
        box-shadow: inset 0 1px 0
          color-mix(in srgb, var(--accent-dark) 28%, transparent);
        pointer-events: none;
      }

      .folder-card:nth-child(2) .folder-front {
        --folder-color: var(--folder-two);
      }

      .folder-card:nth-child(3) .folder-front {
        --folder-color: var(--folder-three);
      }

      .folder-card:nth-child(4) .folder-front {
        --folder-color: var(--folder-four);
      }

      .folder-tab {
        position: absolute;
        top: -13px;
        left: 16px;
        width: 112px;
        height: 15px;
        border-radius: 7px 7px 0 0;
        background: inherit;
        box-shadow: inset 0 1px 0
          color-mix(in srgb, var(--folder-ink) 20%, transparent);
      }

      .folder-tab::after {
        position: absolute;
        top: 9px;
        right: 0;
        left: 0;
        height: 1px;
        background: color-mix(in srgb, var(--folder-ink) 34%, transparent);
        content: "";
      }

      .folder-accent {
        position: absolute;
        top: 26px;
        right: 19px;
        width: 18px;
        height: 18px;
        color: color-mix(in srgb, var(--folder-ink) 78%, transparent);
        opacity: 0.78;
      }

      .folder-accent::before {
        position: absolute;
        top: 1px;
        left: 1px;
        width: 4px;
        height: 4px;
        background: currentColor;
        box-shadow:
          7px 0 currentColor,
          14px 0 currentColor,
          7px 7px currentColor,
          14px 14px currentColor;
        content: "";
      }

      .folder-front-meta,
      .folder-front-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 0.045em;
        line-height: 1.25;
        text-transform: uppercase;
      }

      .folder-front-meta {
        color: color-mix(in srgb, var(--folder-ink) 72%, transparent);
      }

      .folder-front-footer {
        align-self: end;
        margin-top: auto;
        color: color-mix(in srgb, var(--folder-ink) 84%, transparent);
      }

      .folder-cta {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: var(--folder-ink);
        font-weight: 650;
      }

      .folder-cta svg {
        width: 13px;
        height: 13px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      .folder-front strong {
        max-width: 300px;
        margin-top: 0;
        color: var(--folder-ink);
        font-size: 21px;
        letter-spacing: -0.01em;
        line-height: 1.05;
      }

      .folder-front small {
        max-width: 320px;
        display: -webkit-box;
        overflow: hidden;
        margin-top: 0;
        color: color-mix(in srgb, var(--folder-ink) 82%, transparent);
        font-size: 13px;
        line-height: 1.42;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .folder-paper-note {
        position: absolute;
        top: 13px;
        right: 17px;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 8px;
        letter-spacing: 0.055em;
        text-transform: uppercase;
      }

      .folder-card:nth-child(1) {
        --sheet-tilt: -1.2deg;
        --paper-back-tilt: -3.2deg;
        --paper-mid-tilt: 1.5deg;
      }

      .folder-card:nth-child(2) {
        --sheet-tilt: 0.8deg;
        --paper-back-tilt: 2.8deg;
        --paper-mid-tilt: -1.2deg;
      }

      .folder-card:nth-child(3) {
        --sheet-tilt: -0.6deg;
        --paper-back-tilt: -2.6deg;
        --paper-mid-tilt: 1deg;
      }

      .folder-card:nth-child(4) {
        --sheet-tilt: 1.1deg;
        --paper-back-tilt: 3deg;
        --paper-mid-tilt: -1.4deg;
      }

      .folder-sheet {
        transform: translateY(0) rotate(var(--sheet-tilt));
      }

      .folder-card:hover .folder-sheet,
      .folder-card:focus-visible .folder-sheet {
        box-shadow: 0 15px 24px var(--shadow-soft);
      }

      .folder-card:hover .folder-paper-back,
      .folder-card:focus-visible .folder-paper-back {
        box-shadow: 0 12px 20px var(--shadow-soft);
        transform: translateY(-26px) rotate(var(--paper-back-tilt));
      }

      .folder-card:hover .folder-paper-mid,
      .folder-card:focus-visible .folder-paper-mid {
        box-shadow: 0 13px 22px var(--shadow-soft);
        transform: translateY(-38px) rotate(var(--paper-mid-tilt));
      }

      .folder-card:hover .folder-sheet,
      .folder-card:focus-visible .folder-sheet {
        transform: translateY(-52px) rotate(var(--sheet-tilt));
      }

      .folder-card:hover .folder-sheet > span,
      .folder-card:focus-visible .folder-sheet > span {
        opacity: 1;
      }

      .folder-card:hover .folder-front,
      .folder-card:focus-visible .folder-front {
        background:
          linear-gradient(
            135deg,
            color-mix(in srgb, var(--folder-ink) 16%, transparent),
            transparent 35%
          ),
          repeating-linear-gradient(
            0deg,
            color-mix(in srgb, var(--folder-ink) 5%, transparent) 0 1px,
            transparent 1px 5px
          ),
          var(--folder-hover);
        box-shadow:
          0 7px 0 color-mix(in srgb, var(--accent-dark) 52%, transparent),
          0 17px 24px var(--shadow-soft);
        transform: translateY(3px) rotate(-0.2deg);
      }

      .folder-shelf {
        display: none;
      }

      .folder-shelf-foreground {
        position: absolute;
        z-index: 5;
        right: -13px;
        bottom: -2px;
        left: -13px;
        height: 78px;
        border: 1px solid
          color-mix(in srgb, var(--line-strong) 48%, transparent);
        border-radius: 0 0 26px 26px;
        background: color-mix(in srgb, var(--surface) 30%, transparent);
        box-shadow:
          inset 0 1px 0 color-mix(in srgb, var(--surface) 44%, transparent),
          0 7px 16px color-mix(in srgb, var(--shadow-soft) 80%, transparent);
        pointer-events: none;
      }

      .orientation-panel {
        display: grid;
        grid-template-columns: minmax(0, 0.98fr) minmax(0, 1.02fr);
        align-items: stretch;
        gap: 24px;
        margin-top: 48px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: color-mix(in srgb, var(--surface) 75%, var(--bg));
        padding: 16px;
      }

      .video-frame {
        position: relative;
        min-height: 228px;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background:
          linear-gradient(rgba(116, 88, 65, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(116, 88, 65, 0.04) 1px, transparent 1px),
          var(--paper);
        background-size: 20px 20px;
        box-shadow: 0 9px 18px var(--shadow-soft);
      }

      .video-frame::before {
        position: absolute;
        top: 12px;
        right: 12px;
        left: 12px;
        height: 1px;
        background: var(--line);
        content: "";
      }

      .video-frame img {
        position: absolute;
        top: 28px;
        left: 50%;
        width: 72%;
        height: 76%;
        object-fit: contain;
        filter: grayscale(1) sepia(0.45) saturate(0.68) contrast(0.92);
        transform: translateX(-50%);
      }

      .video-meta {
        position: absolute;
        right: 12px;
        bottom: 10px;
        left: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }

      .video-play {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 45px;
        height: 45px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        color: var(--accent-dark);
        box-shadow: 0 5px 12px var(--shadow-soft);
        transform: translate(-50%, -50%);
        transition:
          background 160ms ease,
          color 160ms ease;
      }

      .video-play span {
        margin-left: 2px;
        font-size: 13px;
      }

      .video-play:hover,
      .video-play:focus-visible {
        background: var(--text);
        color: var(--bg);
      }

      .orientation-copy {
        display: grid;
        align-content: center;
        gap: 13px;
        padding: 8px 8px 8px 0;
      }

      .orientation-copy h2 {
        max-width: 480px;
        margin: 0;
        color: var(--text);
        font-size: clamp(24px, 3vw, 32px);
        font-weight: 680;
        letter-spacing: -0.03em;
        line-height: 1.08;
      }

      .orientation-copy p {
        max-width: 500px;
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.58;
      }

      .orientation-cues {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
      }

      .access-label {
        font-family: var(--font-mono);
        font-size: 9px;
        font-weight: 620;
        letter-spacing: 0.055em;
        text-transform: uppercase;
      }

      .access-label.free {
        color: var(--success);
      }

      .access-label.paid {
        color: var(--accent-dark);
      }

      .orientation-copy .button-primary {
        width: fit-content;
      }

      .home-library-rows {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 54px;
        margin-top: 52px;
      }

      .home-new {
        width: min(736px, 100%);
        margin: 68px auto 0;
      }

      .home-reading {
        display: grid;
        grid-template-columns: minmax(0, 1.16fr) minmax(270px, 0.84fr);
        gap: 30px;
        margin-top: 54px;
      }

      .reading-panel {
        min-width: 0;
        border-top: 2px solid var(--text);
        border-bottom: 1px solid var(--line);
        background: var(--paper);
        padding: 24px;
      }

      .reading-panel-header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 20px;
      }

      .reading-panel h2 {
        max-width: 410px;
        font-size: 26px;
      }

      .reading-panel > p {
        max-width: 560px;
        margin: 13px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.56;
      }

      .orientation-art {
        position: relative;
        display: grid;
        min-height: 185px;
        place-items: center;
        overflow: hidden;
        margin: 22px 0 20px;
        border: 1px solid var(--line-strong);
        background:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px),
          var(--surface-soft);
        background-size: 25px 25px;
      }

      .orientation-art::after {
        position: absolute;
        right: 17%;
        bottom: 16px;
        left: 17%;
        height: 11px;
        border-radius: 50%;
        background: var(--shadow);
        content: "";
        filter: blur(7px);
      }

      .orientation-art img {
        position: relative;
        z-index: 1;
        width: min(230px, 62%);
        height: 185px;
        object-fit: contain;
      }

      .orientation-art .art-label {
        position: absolute;
        top: 15px;
        left: 16px;
        z-index: 2;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .orientation-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--line);
        padding-top: 15px;
      }

      .orientation-footer p {
        max-width: 380px;
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .reading-rail {
        min-width: 0;
      }

      .reading-rail-section + .reading-rail-section {
        margin-top: 30px;
      }

      .reading-rail-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line-strong);
        padding-bottom: 11px;
      }

      .reading-rail-heading h2 {
        margin: 6px 0 0;
        font-size: 18px;
        line-height: 1.1;
      }

      .reading-list,
      .route-list,
      .plain-list {
        display: grid;
      }

      .value-layer-row {
        display: grid;
        grid-template-columns: minmax(150px, 0.7fr) minmax(0, 1fr);
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding: 14px 0;
      }

      .value-layer-row strong {
        display: block;
        font-size: 14px;
        line-height: 1.25;
      }

      .value-layer-row p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.42;
      }

      .value-layer-delivery {
        margin: 12px 0 0;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.03em;
        line-height: 1.45;
      }

      .resource-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding: 14px 0;
      }

      .resource-row:hover,
      .resource-row:focus-visible {
        background: color-mix(in srgb, var(--surface-soft) 68%, transparent);
        outline-offset: 4px;
      }

      .resource-row strong {
        display: block;
        margin-top: 6px;
        font-size: 14px;
        letter-spacing: -0.01em;
        line-height: 1.25;
      }

      .resource-row p {
        max-width: 360px;
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.42;
      }

      .route-arrow {
        display: inline-flex;
        width: 28px;
        height: 28px;
        align-items: center;
        justify-content: center;
        color: var(--accent-dark);
      }

      .route-arrow svg {
        width: 15px;
        height: 15px;
      }

      .page-header {
        width: min(var(--reading-track-width), 100%);
        margin-inline: auto;
      }

      .page-header.compact {
        max-width: none;
      }

      .page-header h1 {

        function currentRoute() {
          const raw = (location.hash || "#/").slice(1) || "/";
          const [pathname, queryString = ""] = raw.split("?");
          return {
            path: pathname.startsWith("/") ? pathname : `/${pathname}`,
            query: new URLSearchParams(queryString),
          };
        }

        function ensureHistoryState() {
          if (history.state?.resourcesPreview) return;
          history.replaceState(
            {
              ...(history.state || {}),
              resourcesPreview: true,
              resourcesIndex: 0,
              resourcesMaxIndex: 0,
            },
            "",
            location.href,
          );
        }

        function navigate(route) {
          const nextHash = route.startsWith("#") ? route : `#${route}`;
          if (location.hash === nextHash) {
            renderFromHistory();
            return;
          }
          ensureHistoryState();
          const currentState = history.state;
          const nextIndex = (currentState.resourcesIndex || 0) + 1;
          history.replaceState(
            { ...currentState, resourcesMaxIndex: nextIndex },
            "",
            location.href,
          );
          history.pushState(
            {
              ...currentState,
              resourcesIndex: nextIndex,
              resourcesMaxIndex: nextIndex,
            },
            "",
            nextHash,
          );
          renderFromHistory();
        }

        function renderFromHistory() {
          ensureHistoryState();
          if (lastRenderedLocation === location.href) {
            updateTopbarControls();
            return;
          }
          renderPage();
          lastRenderedLocation = location.href;
          window.scrollTo(0, 0);
          main.focus({ preventScroll: true });
        }

        function updateTopbarControls() {
          const state = history.state || {};
          const historyIndex = Number.isInteger(state.resourcesIndex)
            ? state.resourcesIndex
            : 0;
          const historyMaxIndex = Number.isInteger(state.resourcesMaxIndex)
            ? state.resourcesMaxIndex
            : historyIndex;
          const sidebarToggle = document.querySelector(
            '[data-action="toggle-sidebar"]',
          );
          const backButton = document.querySelector(
            '[data-action="history-back"]',
          );
          const forwardButton = document.querySelector(
            '[data-action="history-forward"]',
          );
          const isMobile = window.matchMedia("(max-width: 900px)").matches;
          if (sidebarToggle) {
            sidebarToggle.innerHTML = icon(
              isMobile ? "menu" : sidebarCollapsed ? "expand" : "collapse",
            );
            const label = isMobile
              ? "Open navigation"
              : `${sidebarCollapsed ? "Expand" : "Collapse"} sidebar`;
            sidebarToggle.setAttribute("aria-label", label);
            sidebarToggle.setAttribute("title", label);
            sidebarToggle.setAttribute(
              "aria-expanded",
              String(isMobile ? drawerOpen : !sidebarCollapsed),
            );
          }
          if (backButton) {
            backButton.innerHTML = icon("back");
            backButton.disabled = historyIndex <= 0;
          }
          if (forwardButton) {
            forwardButton.innerHTML = icon("forward");
            forwardButton.disabled = historyIndex >= historyMaxIndex;
          }
        }

                  note: detail.note,

              ],
            };
          }
          return null;

        function renderPage() {
          const route = currentRoute();
          const path = route.path;
          const firstChildRoutes = {
            "/explore": "/explore/start-here",
            "/business-freedom-ecosystem":
              "/business-freedom-ecosystem/understand-your-business",
            "/open-source": "/open-source/aios-template",
            "/in-practice": "https://arcitai.com/",
          };
          if (firstChildRoutes[path]) {
            if (firstChildRoutes[path].startsWith("http")) {
              window.open(
                firstChildRoutes[path],
                "_blank",
                "noopener,noreferrer",
              );
              return;
            }
            history.replaceState(
              {
                ...history.state,
                resourcesIndex: history.state.resourcesIndex || 0,
              },
              "",
              routeHref(firstChildRoutes[path]),
            );
            return renderPage();
          }
          let markup;
          const resourcePageData = resourcePageForPath(path);
          if (path === "/") markup = homePage();
          else if (resourcePageData) {
            const subpageKinds = new Set([
              "explore-child",
              "ai-literacy-concept",
              "open-source-child",
              "ecosystem-step",
              "ecosystem-toolkit",
              "in-practice-child",
            ]);
            markup = subpageKinds.has(resourcePageData.kind)
              ? resourceSubpageTemplate(resourcePageData)
              : resourcePageTemplate(resourcePageData);
          } else if (path === "/account") markup = accountPage();
          else if (path === "/help") markup = helpPage();
          else if (path === "/search")
            markup = searchPage(route.query.get("query") || "");
          else markup = notFoundPage();

          main.innerHTML = markup;
          routeLabel.textContent = routeTitle(path);
          renderSidebar(path);
          updateTopbarIcons();
          updateTopbarControls();
          bindPageForms();
          bindVideoPlayer();
          if (path === "/search")
            updateSearchResults(
              route.query.get("query") || "",
              document.getElementById("page-search-results"),
            );
          closeDrawer();
        }

        function updateTopbarIcons() {
          const searchButton = document.querySelector(
            '[data-action="search"] .topbar-action-icon',

          const newsletterIcon = document.querySelector(
            '[data-external="newsletter"] .topbar-action-icon',
          );
          const loginButton = document.querySelector(
            '.topbar-action[href="#/account"] .topbar-action-icon',
          );
          if (searchButton) searchButton.innerHTML = icon("search");
          if (newsletterIcon) newsletterIcon.innerHTML = icon("external");
          if (loginButton) loginButton.innerHTML = icon("user");
          const themeButton = document.querySelector('[data-action="theme"]');
          if (themeButton) {
            const label =
              theme === "light"
                ? "Switch to dark theme"
                : "Switch to light theme";
            themeButton.setAttribute("aria-label", label);
            themeButton.setAttribute("title", label);
          }
        }

        function setTheme(nextTheme) {
          theme = nextTheme;
          document.documentElement.dataset.theme = theme;
          localStorage.setItem(STORAGE.theme, theme);
          updateTopbarIcons();
        }

          sidebarCollapsed = !sidebarCollapsed;

          );

          updateTopbarControls();

            aiLiteracyExpanded = true;

        function showToast(message) {
          toast.textContent = message;

        function resultMarkup(item) {

        }

        function findResults(query) {
          const normalized = query.trim().toLowerCase();
          if (!normalized) return [];
          return allSearchable
            .filter((item) =>
              `${item.title} ${item.meta} ${item.description}`
                .toLowerCase()
                .includes(normalized),
            )
            .slice(0, 8);
        }

        function clearValidation(form) {
          form
            .querySelectorAll("[aria-invalid='true']")
            .forEach((field) => field.removeAttribute("aria-invalid"));
          form
            .querySelectorAll(".form-error")
            .forEach((error) => error.remove());
        }

        function updateSearchResults(query, target) {
          if (!target) return;
          target.innerHTML =
            '<p class="search-loading">Searching the local library…</p>';
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => {
            const results = findResults(query);
            target.innerHTML = results.length
              ? results.map(resultMarkup).join("")
              : `<div class="search-empty"><strong>No page matches “${escapeHTML(query || "that phrase")}".</strong>Try a broader word such as <em>constraint</em>, <em>software</em>, or <em>Start Here</em>.</div>`;
          }, 180);
        }

        function openSearch() {
          searchModalPreviousFocus = document.activeElement;
          searchModal.hidden = false;

          window.setTimeout(() => modalSearchInput.focus(), 0);

        function closeSearch() {
          searchModal.hidden = true;
          searchModalPreviousFocus?.focus?.();

          const frame = video.closest("[data-vsl-frame]");
          const button = frame?.querySelector("[data-action='play-vsl']");
          if (!frame || !button) return;
          const playing = !video.paused && !video.ended;
          frame.classList.toggle("is-playing", playing);
          button.hidden = playing;
          if (!playing) {
            const replay = video.ended || video.currentTime > 0.05;
            button.setAttribute(
              "aria-label",
              replay
                ? "Replay the Resources motion preview"
                : "Play the Resources motion preview",
            );
            const label = button.querySelector("span:last-child");
            if (label)
              label.textContent = replay ? "Replay preview" : "Play preview";
          }
        }

        function bindVideoPlayer() {
          const video = document.getElementById("resources-video");
          if (!video) return;
          const sync = () => syncVideoOverlay(video);
          video.addEventListener("play", sync);
          video.addEventListener("pause", sync);
          video.addEventListener("ended", sync);
          sync();
        }

        function playVideoPreview() {
          const video = document.getElementById("resources-video");
          if (!video) return;
          if (video.ended) video.currentTime = 0;
          const playRequest = video.play();
          if (playRequest?.catch) {
            playRequest.catch(() => {
              showToast("Use the native controls to start the preview.");
            });
          }
        }

        function bindPageForms() {
          const accountForm = document.getElementById("account-form");
          if (accountForm) {
            accountForm.addEventListener("submit", (event) => {
              event.preventDefault();
              const input = accountForm.querySelector("input");
              clearValidation(accountForm);
              if (!accountForm.checkValidity()) {
                input?.setAttribute("aria-invalid", "true");
                if (!accountForm.querySelector(".form-error"))
                  input?.insertAdjacentHTML(
                    "afterend",
                    '<p class="form-error">Enter a valid email address before continuing.</p>',
                  );
                showToast(
                  "Enter a valid email address to see the success state.",
                );
                return;
              }
              if (
                !accountForm.nextElementSibling?.classList.contains(
                  "form-feedback",
                )
              )
                accountForm.insertAdjacentHTML(
                  "afterend",
                  '<p class="form-feedback">Preview success: a magic link would return you to the page you meant to open.</p>',
                );
            });
          }

          const helpForm = document.getElementById("help-form");
          if (helpForm) {
            helpForm.addEventListener("submit", (event) => {
              event.preventDefault();
              clearValidation(helpForm);
              const fields = [...helpForm.querySelectorAll("input, textarea")];
              if (!helpForm.checkValidity()) {
                fields
                  .filter((field) => !field.value.trim())
                  .forEach((field) => {
                    field.setAttribute("aria-invalid", "true");
                    if (
                      !field.nextElementSibling?.classList.contains(
                        "form-error",
                      )
                    )
                      field.insertAdjacentHTML(
                        "afterend",
                        '<p class="form-error">Add this detail so the note can be handed off.</p>',
                      );
                  });
                showToast("Add the route and a short description first.");
                return;
              }
              if (
                !helpForm.nextElementSibling?.classList.contains(
                  "form-feedback",
                )
              )
                helpForm.insertAdjacentHTML(
                  "afterend",
                  '<p class="form-feedback">Preview success: the support note is ready to hand off when the connection returns.</p>',
                );
            });
          }

          const pageSearchForm = document.getElementById("page-search-form");
          if (pageSearchForm) {
            pageSearchForm.addEventListener("submit", (event) => {
              event.preventDefault();
              const value =
                pageSearchForm.querySelector("input")?.value.trim() || "";
              navigate(`/search?query=${encodeURIComponent(value)}`);
            });
          }
        }

        document.addEventListener("click", (event) => {
          const action = event.target.closest("[data-action]")?.dataset.action;
          if (!action) return;
          if (action === "toggle-sidebar") {
            if (window.matchMedia("(max-width: 900px)").matches) openDrawer();
            else toggleSidebar();
          }
          if (action === "history-back") history.back();
          if (action === "history-forward") history.forward();
          if (action === "close-drawer") closeDrawer();
          if (action === "toggle-ai-literacy") toggleAiLiteracy();
          if (action === "search") openSearch();
          if (action === "close-search") closeSearch();
          if (action === "play-vsl") playVideoPreview();
          if (action === "theme")
            setTheme(theme === "light" ? "dark" : "light");
        });

        document.addEventListener("keydown", (event) => {
          const target =
            event.target instanceof Element
              ? event.target.closest('[data-action="toggle-ai-literacy"]')
              : null;
          if (!target) return;
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          if (event.repeat) return;
          toggleAiLiteracy();
        });

        document.addEventListener("click", (event) => {
          const link = event.target.closest('a[href^="#"]');
          if (!link || link.getAttribute("href") === "#main-content") return;
          if (
            event.defaultPrevented ||
            event.button !== 0 ||
            event.metaKey ||
            event.ctrlKey ||
            event.shiftKey ||
            event.altKey ||
            link.target
          )
            return;
          event.preventDefault();
          navigate(link.getAttribute("href").slice(1));
          if (window.matchMedia("(max-width: 900px)").matches) closeDrawer();
        });

        drawerBackdrop.addEventListener("click", closeDrawer);
        searchModal.addEventListener("click", (event) => {
          if (event.target === searchModal) closeSearch();
        });
        modalSearchInput.addEventListener("input", () =>
          updateSearchResults(modalSearchInput.value, modalResults),
        );
        document
          .getElementById("modal-search-form")
          .addEventListener("submit", (event) => {
            event.preventDefault();
            const query = modalSearchInput.value.trim();
            closeSearch();
            navigate(`/search?query=${encodeURIComponent(query)}`);
          });

        window.addEventListener("hashchange", renderFromHistory);
        window.addEventListener("popstate", renderFromHistory);

        window.addEventListener("resize", () => {
          const isMobileViewport =
            window.matchMedia("(max-width: 900px)").matches;
          if (isMobileViewport === wasMobileViewport) return;
          wasMobileViewport = isMobileViewport;
          closeDrawer();
          renderSidebar(currentRoute().path);
          updateTopbarControls();
        });

        window.addEventListener("keydown", (event) => {
          if (
            (event.metaKey || event.ctrlKey) &&
            event.key.toLowerCase() === "k"
          ) {
            event.preventDefault();
            openSearch();
          }
          if (event.key === "Escape") {
            if (!searchModal.hidden) closeSearch();
            else if (drawerOpen) closeDrawer();
          }
        });

        document.documentElement.dataset.theme = theme;
        ensureHistoryState();
        renderFromHistory();
      })();
    </script>
  </body>
</html>
