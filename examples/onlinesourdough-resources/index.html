<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A static design preview for the resources.onlinesourdough decision library."
    />
    <title>Resources — onlinesourdough</title>
    <style>
      @font-face {
        font-family: "Geist Sans";
        src: url("assets/fonts/geist-sans-variable.woff2") format("woff2");
        font-display: swap;
        font-style: normal;
        font-weight: 100 900;
      }

      @font-face {
        font-family: "Geist Mono";
        src: url("assets/fonts/geist-mono-variable.woff2") format("woff2");
        font-display: swap;
        font-style: normal;
        font-weight: 100 900;
      }

      @font-face {
        font-family: "Geist Pixel";
        src: url("assets/fonts/geist-pixel-square.woff2") format("woff2");
        font-display: swap;
        font-style: normal;
        font-weight: 400;
      }

      :root {
        color-scheme: light;
        --bg: #f8f2e8;
        --surface: #fffaf1;
        --surface-soft: #f1eadf;
        --paper: #fffdf7;
        --text: #2b1b12;
        --muted: #806c5c;
        --line: #e5d7c6;
        --line-strong: #d4bd9f;
        --accent: #b86f36;
        --accent-dark: #663715;
        --focus: #2b6f98;
        --success: #3b6f55;
        --error: #9f3e2c;
        --folder-one: #925324;
        --folder-two: #925324;
        --folder-three: #925324;
        --folder-four: #925324;
        --folder-hover: #a35f2d;
        --shadow: rgba(70, 39, 20, 0.12);
        --shadow-soft: rgba(70, 39, 20, 0.06);
        --font-sans:
          "Geist Sans", Arial, Helvetica, ui-sans-serif, system-ui, sans-serif;
        --font-mono: "Geist Mono", SFMono-Regular, Consolas, monospace;
        --font-pixel: "Geist Pixel", "Geist Mono", monospace;
        --sidebar-width: 250px;
        --sidebar-collapsed-width: 76px;
        --topbar-height: 62px;
        --content-width: 1180px;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #18120e;
        --surface: #221813;
        --surface-soft: #2a1e17;
        --paper: #302219;
        --text: #fff2df;
        --muted: #c6ad94;
        --line: #3c2b21;
        --line-strong: #69462d;
        --accent: #d58a48;
        --accent-dark: #f0c48a;
        --focus: #6db8df;
        --success: #8bc29d;
        --error: #f09a83;
        --folder-one: #a65b27;
        --folder-two: #a65b27;
        --folder-three: #a65b27;
        --folder-four: #a65b27;
        --folder-hover: #b76a35;
        --shadow: rgba(0, 0, 0, 0.32);
        --shadow-soft: rgba(0, 0, 0, 0.2);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        min-height: 100dvh;
        margin: 0;
        overflow-x: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button,
      input,
      textarea {
        color: inherit;
        font: inherit;
      }

      button {
        border: 0;
      }

      [hidden] {
        display: none !important;
      }

      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }

      .skip-link {
        position: fixed;
        z-index: 100;
        top: 12px;
        left: 12px;
        transform: translateY(-160%);
        border-radius: 6px;
        background: var(--text);
        color: var(--bg);
        font-size: 13px;
        font-weight: 700;
        padding: 9px 12px;
        transition: transform 150ms ease;
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .site-shell {
        display: grid;
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
        min-height: 100dvh;
        transition: grid-template-columns 180ms ease;
      }

      .site-shell.sidebar-collapsed {
        grid-template-columns: var(--sidebar-collapsed-width) minmax(0, 1fr);
      }

      .sidebar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        min-width: 0;
        height: 100dvh;
        flex-direction: column;
        overflow: hidden;
        border-right: 1px solid var(--line);
        background: var(--surface);
      }

      .sidebar-header {
        display: flex;
        min-height: var(--topbar-height);
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px solid var(--line);
        padding: 9px 12px;
      }

      .brand {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 9px;
      }

      .brand-mark {
        width: 29px;
        height: 29px;
        flex: 0 0 auto;
        object-fit: contain;
      }

      .brand-copy {
        display: grid;
        min-width: 0;
        gap: 3px;
      }

      .brand-name {
        overflow: hidden;
        color: var(--text);
        font-family: var(--font-pixel);
        font-size: 16px;
        letter-spacing: -0.04em;
        line-height: 1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .brand-suffix {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 9px;
        line-height: 1;
      }

      .icon-button,
      .mobile-menu-button {
        display: inline-flex;
        width: 34px;
        height: 34px;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .icon-button:hover,
      .icon-button:focus-visible,
      .mobile-menu-button:hover,
      .mobile-menu-button:focus-visible {
        background: var(--surface-soft);
        color: var(--text);
      }

      .icon-button svg,
      .mobile-menu-button svg,
      .topbar-action svg,
      .nav-icon svg,
      .route-arrow svg,
      .folder-arrow svg {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.7;
      }

      .sidebar-nav {
        min-height: 0;
        flex: 1;
        overflow-y: auto;
        padding: 17px 10px 18px;
      }

      .nav-section + .nav-section {
        margin-top: 20px;
      }

      .nav-section-title,
      .nav-section-toggle {
        display: flex;
        width: 100%;
        min-height: 31px;
        align-items: center;
        justify-content: space-between;
        border-radius: 7px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font-size: 13px;
        font-weight: 690;
        text-align: left;
      }

      .nav-section-title,
      .nav-section-toggle {
        padding: 0 8px;
      }

      .nav-section-copy {
        display: inline-flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
      }

      .nav-section-symbol {
        color: var(--muted);
      }

      .nav-section-title:hover,
      .nav-section-title:focus-visible,
      .nav-section-toggle:hover,
      .nav-section-toggle:focus-visible {
        background: var(--surface-soft);
      }

      .nav-section-toggle .nav-toggle-icon {
        transition: transform 160ms ease;
      }

      .nav-section-toggle[aria-expanded="true"] .nav-toggle-icon {
        transform: rotate(90deg);
      }

      .nav-section-toggle[aria-expanded="false"] .nav-toggle-icon {
        transform: rotate(0deg);
      }

      .nav-list {
        display: grid;
        gap: 2px;
        margin-top: 4px;
      }

      .nav-child,
      .nav-utility {
        display: flex;
        min-width: 0;
        min-height: 31px;
        align-items: center;
        gap: 8px;
        border-radius: 7px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 560;
        line-height: 1.25;
        padding: 0 8px 0 15px;
      }

      .nav-child:hover,
      .nav-child:focus-visible,
      .nav-child.is-active,
      .nav-utility:hover,
      .nav-utility:focus-visible,
      .nav-utility.is-active {
        background: var(--surface-soft);
        color: var(--text);
      }

      .nav-child.is-active,
      .nav-utility.is-active {
        font-weight: 700;
      }

      .nav-child-label,
      .nav-utility-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .nav-icon {
        display: inline-flex;
        width: 18px;
        flex: 0 0 18px;
        align-items: center;
        justify-content: center;
        color: currentColor;
      }

      .nav-icon svg {
        width: 15px;
        height: 15px;
      }

      .sidebar-bottom {
        display: grid;
        gap: 2px;
        border-top: 1px solid var(--line);
        padding: 12px 10px 15px;
      }

      .site-shell.sidebar-collapsed .sidebar-header {
        justify-content: center;
        padding-inline: 8px;
      }

      .site-shell.sidebar-collapsed .brand-copy,
      .site-shell.sidebar-collapsed .nav-section-title > span,
      .site-shell.sidebar-collapsed .nav-section-label,
      .site-shell.sidebar-collapsed .nav-toggle-icon,
      .site-shell.sidebar-collapsed .nav-child-label,
      .site-shell.sidebar-collapsed .nav-utility-label {
        display: none;
      }

      .site-shell.sidebar-collapsed .brand {
        justify-content: center;
      }

      .site-shell.sidebar-collapsed .nav-section + .nav-section {
        margin-top: 14px;
      }

      .site-shell.sidebar-collapsed .nav-section-title,
      .site-shell.sidebar-collapsed .nav-section-toggle {
        justify-content: center;
        padding-inline: 0;
      }

      .site-shell.sidebar-collapsed .nav-section-copy {
        justify-content: center;
      }

      .site-shell.sidebar-collapsed .nav-list {
        margin-top: 2px;
      }

      .site-shell.sidebar-collapsed .nav-child,
      .site-shell.sidebar-collapsed .nav-utility {
        justify-content: center;
        padding-inline: 0;
      }

      .site-shell.sidebar-collapsed .nav-child .nav-icon,
      .site-shell.sidebar-collapsed .nav-utility .nav-icon {
        width: 20px;
        flex-basis: 20px;
      }

      .site-main {
        min-width: 0;
        min-height: 100dvh;
        background:
          linear-gradient(rgba(116, 88, 65, 0.027) 1px, transparent 1px),
          linear-gradient(90deg, rgba(116, 88, 65, 0.027) 1px, transparent 1px),
          var(--bg);
        background-size: 52px 52px;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        min-height: var(--topbar-height);
        align-items: center;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        background: color-mix(in srgb, var(--bg) 94%, transparent);
        padding: 0 clamp(18px, 3vw, 42px);
        backdrop-filter: blur(10px);
      }

      .mobile-menu-button {
        display: none;
      }

      .topbar-breadcrumb {
        display: inline-flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .topbar-breadcrumb strong {
        overflow: hidden;
        color: var(--text);
        font-weight: 560;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .topbar-actions {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 4px;
        margin-left: auto;
      }

      .topbar-action {
        display: inline-flex;
        min-height: 34px;
        align-items: center;
        gap: 7px;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        padding: 0 9px;
        white-space: nowrap;
      }

      .topbar-action:hover,
      .topbar-action:focus-visible,
      .topbar-action.is-active {
        background: var(--surface-soft);
        color: var(--text);
      }

      .topbar-action kbd {
        border: 1px solid var(--line-strong);
        border-radius: 4px;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 9px;
        line-height: 1;
        padding: 3px 4px;
      }

      .theme-mark {
        display: inline-flex;
        width: 15px;
        height: 15px;
        align-items: center;
        justify-content: center;
        border: 1px solid currentColor;
        border-radius: 50%;
        font-size: 9px;
        line-height: 1;
      }

      .page {
        width: min(calc(100% - 64px), 1120px);
        margin: 0 auto;
        padding: 48px 0 72px;
      }

      .page-kicker,
      .section-kicker,
      .folder-meta,
      .list-meta,
      .status-label,
      .route-label,
      .utility-label {
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 550;
        letter-spacing: 0.07em;
        line-height: 1.3;
        text-transform: uppercase;
      }

      .page-intro {
        display: block;
        max-width: 820px;
      }

      .page-intro h1,
      .page-header h1 {
        max-width: 780px;
        margin: 19px 0 0;
        color: var(--text);
        font-family: var(--font-pixel);
        font-size: clamp(38px, 5vw, 58px);
        font-weight: 400;
        letter-spacing: -0.035em;
        line-height: 1.02;
      }

      .page-intro p,
      .page-header p {
        max-width: 690px;
        margin: 17px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.62;
      }

      .page-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 18px;
        margin-top: 25px;
      }

      .button-primary,
      .button-secondary,
      .text-link {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.2;
        padding: 0 14px;
      }

      .button-primary {
        background: var(--text);
        color: var(--bg);
      }

      .button-primary:hover,
      .button-primary:focus-visible {
        background: var(--accent-dark);
        color: var(--paper);
      }

      .button-secondary {
        border: 1px solid var(--line-strong);
        background: transparent;
        color: var(--text);
      }

      .button-secondary:hover,
      .button-secondary:focus-visible {
        background: var(--surface-soft);
      }

      .text-link {
        min-height: 32px;
        background: transparent;
        color: var(--accent-dark);
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.03em;
        padding: 0;
      }

      .text-link:hover,
      .text-link:focus-visible {
        color: var(--text);
        text-decoration: underline;
        text-underline-offset: 4px;
      }

      .page-note {
        border-left: 2px solid var(--accent);
        padding: 4px 0 4px 17px;
      }

      .page-note strong {
        display: block;
        margin-top: 8px;
        font-size: 15px;
        line-height: 1.25;
      }

      .page-note p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .folder-section {
        margin-top: 48px;
      }

      .section-heading {
        display: flex;
        min-height: 28px;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }

      .section-heading h2,
      .reading-panel h2,
      .route-section h2,
      .state-panel h2 {
        margin: 0;
        color: var(--text);
        font-size: 20px;
        letter-spacing: -0.025em;
        line-height: 1.16;
      }

      .section-heading p {
        max-width: 430px;
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        text-align: right;
      }

      .section-note {
        flex: 0 0 auto;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 10px;
        line-height: 1.3;
        white-space: nowrap;
      }

      .folder-stage {
        position: relative;
        isolation: isolate;
        margin-top: 20px;
      }

      .folder-grid {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .folder-card {
        display: grid;
        min-width: 0;
        gap: 6px;
        color: var(--text);
      }

      .folder-card:focus-visible {
        outline-offset: 5px;
      }

      .folder-visual {
        position: relative;
        display: block;
        height: 190px;
        isolation: isolate;
      }

      .folder-paper {
        position: absolute;
        z-index: 1;
        top: 22px;
        right: 14px;
        left: 14px;
        height: 111px;
        transform: rotate(-1.5deg);
        border: 1px solid var(--line-strong);
        border-radius: 8px 8px 4px 4px;
        background: var(--paper);
        box-shadow: 0 8px 16px var(--shadow-soft);
        transition:
          transform 180ms cubic-bezier(0.16, 1, 0.3, 1),
          box-shadow 180ms ease;
      }

      .folder-paper::before,
      .folder-paper::after {
        position: absolute;
        right: 14px;
        left: 14px;
        height: 1px;
        background: var(--line);
        content: "";
      }

      .folder-paper::before {
        top: 31px;
      }

      .folder-paper::after {
        top: 48px;
        right: 28%;
      }

      .folder-front {
        position: absolute;
        z-index: 2;
        top: 43px;
        right: 0;
        bottom: 10px;
        left: 0;
        display: grid;
        align-content: start;
        gap: 8px;
        overflow: hidden;
        border: 1px solid
          color-mix(in srgb, var(--accent-dark) 65%, var(--line));
        border-radius: 6px 12px 8px 8px;
        background: var(--folder-one);
        color: #fffaf1;
        padding: 14px 13px 16px;
      }

      .folder-card:nth-child(2) .folder-front {
        background: var(--folder-two);
      }

      .folder-card:nth-child(3) .folder-front {
        background: var(--folder-three);
      }

      .folder-card:nth-child(4) .folder-front {
        background: var(--folder-four);
      }

      .folder-tab {
        position: absolute;
        top: -9px;
        left: -1px;
        width: 76px;
        height: 11px;
        border-radius: 6px 6px 0 0;
        background: inherit;
      }

      .folder-tab::after {
        position: absolute;
        top: 8px;
        right: 0;
        left: 0;
        height: 1px;
        background: color-mix(in srgb, #fffaf1 34%, transparent);
        content: "";
      }

      .folder-meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: rgba(255, 250, 241, 0.72);
        color: rgba(255, 250, 241, 0.77);
        font-size: 9px;
      }

      .folder-front strong {
        max-width: 180px;
        margin-top: 0;
        color: #fffaf1;
        font-size: 15px;
        letter-spacing: -0.01em;
        line-height: 1.08;
      }

      .folder-front small {
        max-width: 205px;
        display: -webkit-box;
        overflow: hidden;
        margin-top: 0;
        color: rgba(255, 250, 241, 0.78);
        font-size: 10px;
        line-height: 1.35;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .folder-label {
        display: flex;
        min-width: 0;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        margin-top: 0;
        padding: 0 3px;
      }

      .folder-label strong {
        display: block;
        font-size: 11px;
        letter-spacing: -0.015em;
        line-height: 1.2;
      }

      .folder-label small {
        display: none;
      }

      .folder-arrow {
        display: inline-flex;
        width: auto;
        height: auto;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        border: 0;
        color: var(--accent-dark);
      }

      .folder-card:hover .folder-paper,
      .folder-card:focus-visible .folder-paper {
        transform: translateY(-18px) rotate(-1.5deg);
        box-shadow: 0 12px 20px var(--shadow-soft);
      }

      .folder-card:hover .folder-front,
      .folder-card:focus-visible .folder-front {
        background: var(--folder-hover);
      }

      .folder-shelf {
        position: absolute;
        z-index: 3;
        right: -5px;
        bottom: 12px;
        left: -5px;
        height: 34px;
        border: 1px solid
          color-mix(in srgb, var(--line-strong) 72%, transparent);
        border-radius: 0 0 26px 26px;
        background: color-mix(in srgb, var(--surface) 26%, transparent);
        box-shadow: inset 0 1px 0
          color-mix(in srgb, var(--surface) 68%, transparent);
        backdrop-filter: blur(4px);
        pointer-events: none;
      }

      .orientation-panel {
        display: grid;
        grid-template-columns: minmax(0, 0.98fr) minmax(0, 1.02fr);
        align-items: stretch;
        gap: 24px;
        margin-top: 48px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: color-mix(in srgb, var(--surface) 75%, var(--bg));
        padding: 16px;
      }

      .video-frame {
        position: relative;
        min-height: 228px;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background:
          linear-gradient(rgba(116, 88, 65, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(116, 88, 65, 0.04) 1px, transparent 1px),
          var(--paper);
        background-size: 20px 20px;
        box-shadow: 0 9px 18px var(--shadow-soft);
      }

      .video-frame::before {
        position: absolute;
        top: 12px;
        right: 12px;
        left: 12px;
        height: 1px;
        background: var(--line);
        content: "";
      }

      .video-frame img {
        position: absolute;
        top: 28px;
        left: 50%;
        width: 72%;
        height: 76%;
        object-fit: contain;
        filter: grayscale(1) sepia(0.45) saturate(0.68) contrast(0.92);
        transform: translateX(-50%);
      }

      .video-meta {
        position: absolute;
        right: 12px;
        bottom: 10px;
        left: 12px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 0.045em;
        text-transform: uppercase;
      }

      .video-play {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 45px;
        height: 45px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line-strong);
        border-radius: 50%;
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        color: var(--accent-dark);
        box-shadow: 0 5px 12px var(--shadow-soft);
        transform: translate(-50%, -50%);
        transition:
          background 160ms ease,
          color 160ms ease;
      }

      .video-play span {
        margin-left: 2px;
        font-size: 13px;
      }

      .video-play:hover,
      .video-play:focus-visible {
        background: var(--text);
        color: var(--bg);
      }

      .orientation-copy {
        display: grid;
        align-content: center;
        gap: 13px;
        padding: 8px 8px 8px 0;
      }

      .orientation-copy h2 {
        max-width: 480px;
        margin: 0;
        color: var(--text);
        font-size: clamp(24px, 3vw, 32px);
        font-weight: 680;
        letter-spacing: -0.03em;
        line-height: 1.08;
      }

      .orientation-copy p {
        max-width: 500px;
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.58;
      }

      .orientation-cues {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
      }

      .access-label {
        font-family: var(--font-mono);
        font-size: 9px;
        font-weight: 620;
        letter-spacing: 0.055em;
        text-transform: uppercase;
      }

      .access-label.free {
        color: var(--success);
      }

      .access-label.paid {
        color: var(--accent-dark);
      }

      .orientation-copy .button-primary {
        width: fit-content;
      }

      .home-library-rows {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 54px;
        margin-top: 52px;
      }

      .home-reading {
        display: grid;
        grid-template-columns: minmax(0, 1.16fr) minmax(270px, 0.84fr);
        gap: 30px;
        margin-top: 54px;
      }

      .reading-panel {
        min-width: 0;
        border-top: 2px solid var(--text);
        border-bottom: 1px solid var(--line);
        background: var(--paper);
        padding: 24px;
      }

      .reading-panel-header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 20px;
      }

      .reading-panel h2 {
        max-width: 410px;
        font-size: 26px;
      }

      .reading-panel > p {
        max-width: 560px;
        margin: 13px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.56;
      }

      .orientation-art {
        position: relative;
        display: grid;
        min-height: 185px;
        place-items: center;
        overflow: hidden;
        margin: 22px 0 20px;
        border: 1px solid var(--line-strong);
        background:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px),
          var(--surface-soft);
        background-size: 25px 25px;
      }

      .orientation-art::after {
        position: absolute;
        right: 17%;
        bottom: 16px;
        left: 17%;
        height: 11px;
        border-radius: 50%;
        background: var(--shadow);
        content: "";
        filter: blur(7px);
      }

      .orientation-art img {
        position: relative;
        z-index: 1;
        width: min(230px, 62%);
        height: 185px;
        object-fit: contain;
      }

      .orientation-art .art-label {
        position: absolute;
        top: 15px;
        left: 16px;
        z-index: 2;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .orientation-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-top: 1px solid var(--line);
        padding-top: 15px;
      }

      .orientation-footer p {
        max-width: 380px;
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .reading-rail {
        min-width: 0;
      }

      .reading-rail-section + .reading-rail-section {
        margin-top: 30px;
      }

      .reading-rail-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line-strong);
        padding-bottom: 11px;
      }

      .reading-rail-heading h2 {
        margin: 6px 0 0;
        font-size: 18px;
        line-height: 1.1;
      }

      .reading-list,
      .route-list,
      .step-list {
        display: grid;
      }

      .resource-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding: 14px 0;
      }

      .resource-row:hover,
      .resource-row:focus-visible {
        background: color-mix(in srgb, var(--surface-soft) 68%, transparent);
        outline-offset: 4px;
      }

      .resource-row strong {
        display: block;
        margin-top: 6px;
        font-size: 14px;
        letter-spacing: -0.01em;
        line-height: 1.25;
      }

      .resource-row p {
        max-width: 360px;
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.42;
      }

      .route-arrow {
        display: inline-flex;
        width: 28px;
        height: 28px;
        align-items: center;
        justify-content: center;
        color: var(--accent-dark);
      }

      .route-arrow svg {
        width: 15px;
        height: 15px;
      }

      .offline-note {
        margin: 28px 0 0;
        border-left: 2px solid var(--line-strong);
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        padding-left: 13px;
      }

      .page-header {
        max-width: 800px;
      }

      .page-header.compact {
        max-width: 720px;
      }

      .page-header h1 {
        font-size: clamp(40px, 5vw, 58px);
      }

      .route-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(240px, 0.34fr);
        gap: 42px;
        margin-top: 48px;
      }

      .route-section + .route-section {
        margin-top: 45px;
      }

      .route-section > p {
        max-width: 660px;
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.58;
      }

      .route-list {
        margin-top: 17px;
        border-top: 1px solid var(--line-strong);
      }

      .route-list-item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        border-bottom: 1px solid var(--line);
        padding: 17px 0;
      }

      .route-list-item:hover,
      .route-list-item:focus-visible {
        background: color-mix(in srgb, var(--surface-soft) 60%, transparent);
        outline-offset: 5px;
      }

      .route-list-item strong {
        display: block;
        margin-top: 6px;
        font-size: 17px;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      .route-list-item p {
        max-width: 600px;
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.48;
      }

      .route-side {
        border-top: 2px solid var(--text);
        padding-top: 15px;
      }

      .route-side h2 {
        margin-top: 7px;
        font-size: 17px;
      }

      .route-side p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.55;
      }

      .route-side .route-side-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        color: var(--accent-dark);
        font-size: 12px;
        font-weight: 680;
        padding: 13px 0;
      }

      .route-side .route-side-link:first-of-type {
        margin-top: 16px;
        border-top: 1px solid var(--line);
      }

      .route-side .route-side-link:hover,
      .route-side .route-side-link:focus-visible {
        color: var(--text);
        outline-offset: 5px;
      }

      .course-summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        margin-top: 25px;
        border-block: 1px solid var(--line);
        background: var(--line);
      }

      .course-summary-item {
        min-height: 76px;
        background: var(--bg);
        padding: 15px;
      }

      .course-summary-item strong {
        display: block;
        margin-top: 6px;
        font-size: 15px;
        line-height: 1.2;
      }

      .step-list {
        margin-top: 24px;
        border-top: 1px solid var(--line-strong);
      }

      .step-row {
        display: grid;
        grid-template-columns: 45px minmax(0, 1fr) auto;
        gap: 17px;
        align-items: start;
        border-bottom: 1px solid var(--line);
        padding: 17px 0;
      }

      .step-row:hover,
      .step-row:focus-within {
        background: color-mix(in srgb, var(--surface-soft) 62%, transparent);
      }

      .step-number {
        color: var(--accent-dark);
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.05em;
      }

      .step-row strong {
        display: block;
        font-size: 16px;
        letter-spacing: -0.015em;
        line-height: 1.2;
      }

      .step-row p {
        max-width: 630px;
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.46;
      }

      .access-state {
        align-self: start;
        border: 1px solid var(--line-strong);
        border-radius: 5px;
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 9px;
        letter-spacing: 0.06em;
        padding: 5px 6px;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .access-state.is-paid {
        border-color: color-mix(in srgb, var(--accent) 58%, var(--line));
        color: var(--accent-dark);
      }

      .state-panel {
        border-top: 2px solid var(--text);
        border-bottom: 1px solid var(--line);
        background: var(--paper);
        padding: 22px;
      }

      .state-panel p {
        max-width: 630px;
        margin: 11px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }

      .state-panel .state-status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 3px;
        color: var(--success);
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .state-status::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }

      .project-facts {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1px;
        margin-top: 24px;
        background: var(--line);
      }

      .project-fact {
        background: var(--bg);
        padding: 16px;
      }

      .project-fact strong {
        display: block;
        margin-top: 7px;
        font-size: 14px;
        line-height: 1.25;
      }

      .project-fact p {
        margin-top: 6px;
        font-size: 12px;
        line-height: 1.45;
      }

      .form-panel {
        max-width: 680px;
        margin-top: 40px;
        border-top: 2px solid var(--text);
        border-bottom: 1px solid var(--line);
        background: var(--paper);
        padding: 24px;
      }

      .form-panel h2 {
        margin: 0;
        font-size: 20px;
        line-height: 1.15;
      }

      .form-panel p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .form-grid {
        display: grid;
        gap: 15px;
        margin-top: 22px;
      }

      .form-field {
        display: grid;
        gap: 7px;
      }

      .form-field label {
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .form-field input,
      .form-field textarea,
      .search-input {
        width: 100%;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.4;
        padding: 11px 12px;
      }

      .form-field textarea {
        min-height: 120px;
        resize: vertical;
      }

      .form-field input::placeholder,
      .form-field textarea::placeholder,
      .search-input::placeholder {
        color: var(--muted);
        opacity: 0.8;
      }

      .form-field input[aria-invalid="true"],
      .form-field textarea[aria-invalid="true"] {
        border-color: var(--error);
      }

      .form-error {
        margin: 0;
        color: var(--error);
        font-size: 12px;
        line-height: 1.4;
      }

      .form-feedback {
        margin: 15px 0 0;
        border-left: 2px solid var(--success);
        color: var(--success);
        font-size: 13px;
        line-height: 1.45;
        padding-left: 12px;
      }

      .search-page-controls {
        display: flex;
        align-items: end;
        gap: 10px;
        margin-top: 30px;
      }

      .search-page-controls .search-input {
        max-width: 560px;
      }

      .search-results {
        max-width: 780px;
        margin-top: 27px;
        border-top: 1px solid var(--line-strong);
      }

      .search-result {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding: 16px 0;
      }

      .search-result:hover,
      .search-result:focus-visible {
        background: color-mix(in srgb, var(--surface-soft) 62%, transparent);
        outline-offset: 5px;
      }

      .search-result strong {
        display: block;
        font-size: 16px;
        line-height: 1.2;
      }

      .search-result p {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .search-loading,
      .search-empty {
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
        padding: 19px 0;
      }

      .search-empty strong {
        display: block;
        color: var(--text);
        font-size: 16px;
        margin-bottom: 5px;
      }

      .modal-backdrop,
      .drawer-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(26, 16, 10, 0.38);
      }

      .modal-backdrop {
        z-index: 40;
        display: grid;
        place-items: start center;
        padding: 10vh 20px 20px;
      }

      .modal-backdrop[hidden],
      .drawer-backdrop[hidden] {
        display: none;
      }

      .modal-sheet {
        width: min(640px, 100%);
        max-height: min(690px, 80vh);
        overflow: auto;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: var(--surface);
        box-shadow: 0 24px 70px var(--shadow);
        padding: 22px;
      }

      .modal-header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 18px;
      }

      .modal-header h2 {
        margin: 6px 0 0;
        font-size: 24px;
        line-height: 1.1;
      }

      .modal-sheet > p {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .modal-search-form {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 19px;
      }

      .modal-search-form .search-input {
        flex: 1;
      }

      .modal-results {
        margin-top: 16px;
      }

      .modal-result {
        display: flex;
        min-height: 47px;
        flex-direction: column;
        justify-content: center;
        border-bottom: 1px solid var(--line);
        color: var(--text);
        text-align: left;
      }

      .modal-result:hover,
      .modal-result:focus-visible {
        color: var(--accent-dark);
        outline-offset: 5px;
      }

      .modal-result strong {
        font-size: 14px;
        line-height: 1.2;
      }

      .modal-result small {
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
      }

      .modal-form {
        margin-top: 22px;
      }

      .modal-form .button-primary {
        margin-top: 15px;
      }

      .toast {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 60;
        max-width: min(360px, calc(100vw - 36px));
        transform: translateY(140%);
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: var(--text);
        color: var(--bg);
        font-size: 13px;
        line-height: 1.4;
        padding: 12px 14px;
        transition: transform 180ms ease;
      }

      .toast.is-visible {
        transform: translateY(0);
      }

      .site-footer {
        width: min(calc(100% - 64px), var(--content-width));
        margin: 0 auto;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.035em;
        padding: 17px 0 27px;
      }

      .site-footer span + span {
        margin-left: 16px;
      }

      .drawer-backdrop {
        display: none;
        z-index: 15;
      }

      @media (max-width: 1060px) {
        .page-intro {
          grid-template-columns: minmax(0, 1fr) minmax(200px, 0.36fr);
          gap: 34px;
        }

        .folder-stage {
          padding-inline: 0;
        }

        .folder-front {
          padding: 12px;
        }

        .folder-front strong {
          font-size: 17px;
        }

        .folder-front small {
          font-size: 11px;
        }
      }

      @media (max-width: 900px) {
        .site-shell,
        .site-shell.sidebar-collapsed {
          display: block;
        }

        .sidebar {
          position: fixed;
          width: min(302px, 87vw);
          transform: translateX(-102%);
          box-shadow: 18px 0 45px var(--shadow);
          transition: transform 180ms ease;
        }

        .sidebar.is-open {
          transform: translateX(0);
        }

        .site-shell.sidebar-collapsed .brand-copy,
        .site-shell.sidebar-collapsed .nav-section-title > span,
        .site-shell.sidebar-collapsed .nav-section-label,
        .site-shell.sidebar-collapsed .nav-toggle-icon,
        .site-shell.sidebar-collapsed .nav-child-label,
        .site-shell.sidebar-collapsed .nav-utility-label {
          display: initial;
        }

        .site-shell.sidebar-collapsed .sidebar-header {
          justify-content: space-between;
          padding-inline: 12px;
        }

        .site-shell.sidebar-collapsed .brand {
          justify-content: initial;
        }

        .site-shell.sidebar-collapsed .nav-section + .nav-section {
          margin-top: 20px;
        }

        .site-shell.sidebar-collapsed .nav-section-title,
        .site-shell.sidebar-collapsed .nav-section-toggle {
          justify-content: space-between;
          padding-inline: 8px;
        }

        .site-shell.sidebar-collapsed .nav-section-copy {
          justify-content: initial;
        }

        .site-shell.sidebar-collapsed .nav-section-label {
          display: initial;
        }

        .site-shell.sidebar-collapsed .nav-child,
        .site-shell.sidebar-collapsed .nav-utility {
          justify-content: initial;
          padding-inline: 15px 8px;
        }

        .mobile-menu-button {
          display: inline-flex;
        }

        .drawer-backdrop.is-visible {
          display: block;
        }

        .topbar {
          padding-inline: 18px;
        }

        .page,
        .site-footer {
          width: min(calc(100% - 44px), var(--content-width));
        }
      }

      @media (max-width: 760px) {
        .page-intro,
        .home-reading,
        .home-library-rows,
        .orientation-panel,
        .route-layout {
          grid-template-columns: 1fr;
        }

        .page-note {
          max-width: 540px;
          margin-top: 8px;
        }

        .folder-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .home-reading {
          gap: 40px;
        }

        .orientation-copy {
          padding: 4px;
        }

        .route-side {
          max-width: 600px;
        }

        .course-summary {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 560px) {
        .topbar {
          gap: 7px;
          padding-inline: 12px;
        }

        .topbar-breadcrumb {
          gap: 5px;
          font-size: 9px;
        }

        .topbar-actions {
          gap: 1px;
        }

        .topbar-action {
          width: 31px;
          height: 34px;
          justify-content: center;
          gap: 0;
          padding: 0;
        }

        .topbar-action-label,
        .topbar-action kbd {
          display: none;
        }

        .page,

        };

        const readJSON = (key, fallback) => {
          try {
            const value = JSON.parse(localStorage.getItem(key));
            return value ?? fallback;
          } catch {
            return fallback;
          }
        };

        let theme = localStorage.getItem(STORAGE.theme) || "light";

          localStorage.getItem(STORAGE.sidebar) === "collapsed";

          "open-source": true,
          courses: false,
          projects: false,
        });

          return icons[name] || "";
        }

          return `#${route}`;
        }

        function escapeHTML(value) {
          return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        function currentRoute() {
          const raw = (location.hash || "#/").slice(1) || "/";
          const [pathname, queryString = ""] = raw.split("?");
          return {
            path: pathname.startsWith("/") ? pathname : `/${pathname}`,
            query: new URLSearchParams(queryString),
          };
        }

        function routeTitle(path) {
          if (path === "/" || path === "/explore") return "Explore";
          if (path.startsWith("/explore/"))
            return path.split("/")[2].replaceAll("-", " ");
          if (path.startsWith("/open-source")) return "Open Source";
          if (path.startsWith("/courses")) return "Courses";
          if (path.startsWith("/projects")) return "Projects";
          if (path.startsWith("/search")) return "Search";
          if (path === "/account") return "Account";
          if (path === "/help") return "Need help";
          return "Explore";
        }

        function isActive(path, route) {
          if (route === "/") return path === "/" || path === "/explore";
          return path === route;
        }

        function sidebarMarkup(path) {
          const groupMarkup = (key) => {
            const group = groups[key];
            const expanded = Boolean(groupState[key]);

              </button>
              <div class="nav-list" ${expanded ? "" : "hidden"}>
                ${group.children.map((child) => `<a class="nav-child ${isActive(path, child.route) ? "is-active" : ""}" href="${routeHref(child.route)}" title="${child.title}"><span class="nav-icon" aria-hidden="true">${icon(group.icon)}</span><span class="nav-child-label">${child.title}</span></a>`).join("")}
              </div>
            </section>`;
          };

          return `<section class="nav-section nav-section-explore">
            <a class="nav-section-title" href="${routeHref("/explore")}" title="Explore"><span>Explore</span><span class="nav-icon" aria-hidden="true">${icon("search")}</span></a>

          ${groupMarkup("open-source")}
          ${groupMarkup("courses")}
          ${groupMarkup("projects")}`;
        }

              </div>
              <div class="orientation-copy">
                <span class="section-kicker">Before you open a folder</span>
                <h2 id="orientation-title">Name the constraint, then choose the next useful place.</h2>
                <p>Begin helps you make the question clearer before you choose an open foundation, a connected course, or a project example.</p>
                <div class="orientation-cues"><span class="access-label free">Begin · free</span><span class="access-label paid">Courses · paid</span></div>
                <a class="button-primary" href="${routeHref("/explore/begin")}">Open Begin ${icon("arrow")}</a>
              </div>
            </section>

            <section class="home-library-rows" aria-label="Featured and recently changed resources">
              <section class="reading-rail-section" aria-labelledby="featured-title"><div class="reading-rail-heading"><div><span class="section-kicker">Selected pages</span><h2 id="featured-title">Featured</h2></div><a class="text-link" href="${routeHref("/explore/featured")}">View all</a></div><div class="reading-list">${featured.slice(0, 2).map(resourceRow).join("")}</div></section>
              <section class="reading-rail-section" aria-labelledby="new-title"><div class="reading-rail-heading"><div><span class="section-kicker">Recently changed</span><h2 id="new-title">What's New</h2></div><a class="text-link" href="${routeHref("/explore/whats-new")}">View all</a></div><div class="reading-list">${whatsNew.slice(0, 2).map(resourceRow).join("")}</div></section>
            </section>
          </div>`;
        }

        function explorePage(kind = "explore") {
          const content =
            kind === "featured"
              ? featured
              : kind === "whats-new"
                ? whatsNew
                : exploreChildren;
          const title =
            kind === "featured"
              ? "Featured"
              : kind === "whats-new"
                ? "What's New"
                : "Explore";
          const description =
            kind === "featured"
              ? "A short selection of pages worth keeping close while the rest of the system stays quiet."
              : kind === "whats-new"
                ? "Recent changes are shown with dates and context, not as a noisy update feed."
                : "Start with the question in front of you, then choose a useful next route.";
          const items =
            kind === "explore"
              ? exploreChildren.map((child) => ({
                  ...child,
                  meta:
                    child.title === "Begin" ? "Start here" : "Explore route",
                }))
              : content;
          return `<div class="page"><header class="page-header compact"><span class="page-kicker">Explore / ${kind === "explore" ? "Start here" : title}</span><h1>${title}</h1><p>${description}</p></header><div class="route-layout"><section class="route-section" aria-labelledby="explore-list-title"><span class="section-kicker">Library route</span><h2 id="explore-list-title">${kind === "explore" ? "Choose a useful first surface" : title}</h2><p>${kind === "explore" ? "Explore stays visible in the sidebar because these three routes are the simplest ways into the system." : "Each row carries a route and a concrete reason to open it."}</p><div class="route-list">${items.map(routeListItem).join("")}</div></section><aside class="route-side"><span class="section-kicker">Decision cue</span><h2>${kind === "explore" ? "Not sure where to begin?" : "Keep the context"}</h2><p>${kind === "explore" ? "Open Begin when you have a real constraint. It is designed to get you to a better question before you choose a format." : "Featured and updated pages remain connected to the area they support. Use the sidebar when the question changes."}</p><a class="route-side-link" href="${routeHref("/explore/begin")}">Open Begin <span aria-hidden="true">→</span></a><a class="route-side-link" href="${routeHref("/courses/business-architecture")}">See the ordered course <span aria-hidden="true">→</span></a></aside></div></div>`;
        }

        function beginPage() {
          const nextPlaces = [
            {
              title: "Use an open foundation",
              route: "/open-source",
              meta: "Open Source",
              description:
                "Choose a reusable starting point when the question is already clear.",
            },
            {
              title: "Follow the connected course",
              route: "/courses/business-architecture",
              meta: "Courses",
              description:
                "Use the ordered path when the work needs a complete sequence.",
            },
            {
              title: "See a project in context",
              route: "/projects/aios-desktop",
              meta: "Projects",
              description:
                "Open a project record when an example will make the next decision easier.",
            },
          ];
          return `<div class="page"><header class="page-header compact"><span class="page-kicker">Explore / Begin</span><h1>Begin with the constraint.</h1><p>Name what should become easier, who needs to own the result, and what evidence would make the next move worth taking.</p></header><div class="route-layout"><section class="route-section" aria-labelledby="begin-title"><span class="section-kicker">Free orientation</span><h2 id="begin-title">Choose the smallest useful next place</h2><p>Resources stays simple by making the first decision before choosing a format.</p><div class="route-list">${nextPlaces.map(routeListItem).join("")}</div></section><aside class="route-side"><span class="section-kicker">Begin here</span><h2>What should become easier?</h2><p>Keep the question concrete: one repeating owner task, one business constraint, or one handoff that repeatedly loses context.</p><a class="route-side-link" href="${routeHref("/open-source")}">Browse Open Source <span aria-hidden="true">→</span></a><a class="route-side-link" href="${routeHref("/explore/featured")}">See Featured pages <span aria-hidden="true">→</span></a></aside></div></div>`;
        }

        function openSourcePage() {
          const items = groups["open-source"].children.map((child) => ({
            ...child,
            meta: "Open Source / Internal route",
          }));
          return `<div class="page"><header class="page-header"><span class="page-kicker">Open Source / Use and extend</span><h1>Foundations you can use and extend.</h1><p>These entries keep the reusable parts of AI-native work close to the decisions they support. They are local Resources routes in this preview; no public repository URL is invented.</p></header><div class="route-layout"><section class="route-section" aria-labelledby="open-source-title"><span class="section-kicker">Three local records</span><h2 id="open-source-title">Open Source</h2><p>Choose a foundation by the kind of ownership or extension you need next.</p><div class="route-list">${items.map(routeListItem).join("")}</div></section><aside class="route-side"><span class="section-kicker">Honest status</span><h2>Internal until linked</h2><p>Private or not-yet-public sources stay as internal records. The receiving product can add verified links later without changing the information architecture.</p><a class="route-side-link" href="${routeHref("/explore/begin")}">Back to Explore <span aria-hidden="true">→</span></a><a class="route-side-link" href="${routeHref("/projects/aios-desktop")}">See an internal project <span aria-hidden="true">→</span></a></aside></div></div>`;
        }

        function coursePage() {
          return `<div class="page"><header class="page-header"><span class="page-kicker">Courses / Business Architecture</span><h1>From business constraint to owned result.</h1><p>The Blueprint is the ordered course spine. It keeps the business question, intervention choice, ownership, build, review, and recovery in one sequence.</p><div class="course-summary"><div class="course-summary-item"><span class="list-meta">Format</span><strong>8 ordered steps</strong></div><div class="course-summary-item"><span class="list-meta">Access</span><strong>Paid course</strong></div><div class="course-summary-item"><span class="list-meta">Outcome</span><strong>One owned result</strong></div></div></header><div class="route-layout"><section class="route-section" aria-labelledby="blueprint-title"><span class="section-kicker">Blueprint / Ordered path</span><h2 id="blueprint-title">Business Architecture</h2><p>Numbers appear here because the steps are genuinely ordered. Every lesson keeps the decision and the next proof visible.</p><div class="step-list">${courseSteps.map(([number, title, description]) => `<a class="step-row" href="${routeHref("/account")}"><span class="step-number">${number}</span><span><strong>${title}</strong><p>${description}</p></span><span class="access-state is-paid">Paid · locked</span></a>`).join("")}</div></section><aside class="route-side"><span class="section-kicker">Access state</span><h2>Continue with an account</h2><p>The course preview exposes the shape and sequence without pretending to reveal private lesson content.</p><a class="route-side-link" href="${routeHref("/account")}">Log in to continue <span aria-hidden="true">→</span></a><a class="route-side-link" href="${routeHref("/explore/begin")}">Use the free orientation <span aria-hidden="true">→</span></a></aside></div></div>`;
        }

        function projectPage(slug) {
          const project =
            groups.projects.children.find((child) =>
              child.route.endsWith(slug),
            ) || groups.projects.children[1];
          const isDesktop = slug === "aios-desktop";
          const title = project.title;
          const lead = isDesktop
            ? "An internal home-base application for keeping AIOS work, context, and next actions together."
            : project.description;
          return `<div class="page"><header class="page-header"><span class="page-kicker">Projects / Internal project record</span><h1>${title}</h1><p>${lead}</p></header><div class="route-layout"><section class="route-section" aria-labelledby="project-title"><div class="state-panel"><span class="state-status">Internal route / reviewable</span><h2 id="project-title">A clear place to keep the work in view.</h2><p>${isDesktop ? "This preview route is intentionally honest: it describes the project surface without inventing a public GitHub link or claiming that private implementation details are available here." : "This project record is local to Resources in the preview. A verified external source can be added when one exists."}</p><div class="project-facts"><div class="project-fact"><span class="list-meta">What it supports</span><strong>${isDesktop ? "Context, tasks, and handover" : "Product context and direction"}</strong><p>Keep the business reason and the next useful action together.</p></div><div class="project-fact"><span class="list-meta">Current status</span><strong>Internal / not public</strong><p>Access is represented as permission state, not a fabricated public link.</p></div></div></div><section class="route-section"><span class="section-kicker">Working principle</span><h2>Make ownership visible before adding more surface.</h2><p>Projects belong here when they show how a resource becomes a working system. The route stays short so the library does not turn into a second product dashboard.</p></section></section><aside class="route-side"><span class="section-kicker">Project action</span><h2>Choose the next context</h2><p>Return to the course when you need the ordered decision path, or start with the free orientation when the question is still forming.</p><a class="route-side-link" href="${routeHref("/courses/business-architecture")}">Open Business Architecture <span aria-hidden="true">→</span></a><a class="route-side-link" href="${routeHref("/explore/begin")}">Start with Begin <span aria-hidden="true">→</span></a></aside></div></div>`;
        }

        function accountPage() {
          return `<div class="page"><header class="page-header compact"><span class="page-kicker">Account / Access</span><h1>Continue where the work needs you.</h1><p>Use the email connected to your Resources access. This preview validates the interaction locally and does not send a magic link.</p></header><section class="form-panel" aria-labelledby="account-form-title"><h2 id="account-form-title">Log in to Resources</h2><p>Paid Blueprint steps show their honest locked state until an account is available.</p><form class="form-grid" id="account-form" novalidate><div class="form-field"><label for="account-email">Email address</label><input id="account-email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required /></div><button class="button-primary" type="submit">Send a preview link ${icon("arrow")}</button></form><p class="offline-note">Offline state: no request leaves this preview. In the product, preserve the route and return the user to the page they intended to open.</p></section></div>`;
        }

        function helpPage() {
          return `<div class="page"><header class="page-header compact"><span class="page-kicker">Support / Need help</span><h1>Keep the question small enough to answer.</h1><p>Send the page you were on, the constraint you are working through, and what you expected to happen. Include an exact error when the issue is access-related.</p></header><section class="form-panel" aria-labelledby="help-form-title"><h2 id="help-form-title">What should support see?</h2><p>Validation and success are represented here; the static preview does not send email.</p><form class="form-grid" id="help-form" novalidate><div class="form-field"><label for="help-page">Page or route</label><input id="help-page" name="page" type="text" placeholder="/courses/business-architecture" required /></div><div class="form-field"><label for="help-message">Short description</label><textarea id="help-message" name="message" placeholder="I expected..." required></textarea></div><button class="button-primary" type="submit">Prepare support note ${icon("arrow")}</button></form><p class="offline-note">If you are offline, copy this route and the error text first. The receiving app can attach the note when support becomes available.</p></section></div>`;
        }

        function searchPage(query) {
          return `<div class="page"><header class="page-header compact"><span class="page-kicker">Search / Local library</span><h1>Find the page that helps now.</h1><p>Search titles, areas, and draft outcomes. Results stay tied to honest internal routes.</p></header><form class="search-page-controls" id="page-search-form"><div><label class="sr-only" for="page-search-input">Search Resources</label><input class="search-input" id="page-search-input" type="search" value="${escapeHTML(query)}" placeholder="Try ownership, architecture, or Blueprint" /></div><button class="button-primary" type="submit">Search ${icon("search")}</button></form><div class="search-results" id="page-search-results"></div></div>`;
        }

        function notFoundPage() {
          return `<div class="page"><header class="page-header compact"><span class="page-kicker">Route / Not found</span><h1>This page is not in the preview.</h1><p>Use the visible library routes to find a useful next step. No external or private destination is fabricated here.</p></header><div class="page-actions"><a class="button-primary" href="${routeHref("/")}">Return to Explore ${icon("arrow")}</a></div></div>`;
        }

        function renderPage() {
          const route = currentRoute();
          const path = route.path;
          let markup;
          if (path === "/" || path === "/explore")
            markup = path === "/" ? homePage() : explorePage();
          else if (path === "/explore/featured")
            markup = explorePage("featured");
          else if (path === "/explore/whats-new")
            markup = explorePage("whats-new");
          else if (path === "/explore/begin") markup = beginPage();
          else if (path === "/open-source") markup = openSourcePage();
          else if (path.startsWith("/open-source/")) markup = openSourcePage();
          else if (path === "/courses/business-architecture")
            markup = coursePage();
          else if (path.startsWith("/courses/")) markup = coursePage();
          else if (path.startsWith("/projects/"))
            markup = projectPage(path.split("/").at(-1));
          else if (path === "/account") markup = accountPage();
          else if (path === "/help") markup = helpPage();
          else if (path === "/search")
            markup = searchPage(route.query.get("query") || "");
          else markup = notFoundPage();

          main.innerHTML = markup;
          routeLabel.textContent = routeTitle(path);
          renderSidebar(path);
          updateTopbarIcons();
          bindPageForms();
          if (path === "/search")
            updateSearchResults(
              route.query.get("query") || "",
              document.getElementById("page-search-results"),
            );
          closeDrawer();
        }

        function updateTopbarIcons() {
          const searchButton = document.querySelector(
            '[data-action="search"] .topbar-action-icon',
          );
          const newsletterButton = document.querySelector(
            '[data-action="newsletter"] .topbar-action-icon',
          );
          const loginButton = document.querySelector(
            '.topbar-action[href="#/account"] .topbar-action-icon',
          );
          const menuButton = document.querySelector(
            '[data-action="open-drawer"]',
          );
          if (searchButton) searchButton.innerHTML = icon("search");
          if (newsletterButton) newsletterButton.innerHTML = icon("book");
          if (loginButton) loginButton.innerHTML = icon("user");
          if (menuButton) menuButton.innerHTML = icon("menu");
          const themeMark = document.querySelector(".theme-mark");
          const themeLabel = document.getElementById("theme-label");
          if (themeMark) themeMark.innerHTML = theme === "light" ? "" : "";
          if (themeLabel)
            themeLabel.textContent = theme === "light" ? "Dark" : "Light";
          const themeButton = document.querySelector('[data-action="theme"]');
          if (themeButton)
            themeButton.setAttribute(
              "aria-label",
              theme === "light"
                ? "Switch to dark mode"
                : "Switch to light mode",
            );
        }

        function setTheme(nextTheme) {
          theme = nextTheme;
          document.documentElement.dataset.theme = theme;
          localStorage.setItem(STORAGE.theme, theme);
          updateTopbarIcons();
        }

        function toggleSidebar() {
          sidebarCollapsed = !sidebarCollapsed;
          localStorage.setItem(
            STORAGE.sidebar,
            sidebarCollapsed ? "collapsed" : "expanded",
          );
          renderSidebar(currentRoute().path);
        }

        function toggleGroup(key) {
          groupState[key] = !groupState[key];
          localStorage.setItem(STORAGE.groups, JSON.stringify(groupState));
          renderSidebar(currentRoute().path);
        }

        function openDrawer() {
          drawerOpen = true;
          sidebar.classList.add("is-open");
          drawerBackdrop.hidden = false;
          drawerBackdrop.classList.add("is-visible");
          document
            .querySelector('[data-action="open-drawer"]')
            ?.setAttribute("aria-expanded", "true");
        }

        function closeDrawer() {
          drawerOpen = false;
          sidebar.classList.remove("is-open");
          drawerBackdrop.hidden = true;
          drawerBackdrop.classList.remove("is-visible");
          document
            .querySelector('[data-action="open-drawer"]')
            ?.setAttribute("aria-expanded", "false");
        }

        function showToast(message) {
          toast.textContent = message;
          toast.classList.add("is-visible");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(
            () => toast.classList.remove("is-visible"),
            3600,
          );
        }

        function resultMarkup(item) {
          return `<a class="modal-result" href="${routeHref(item.route)}"><strong>${escapeHTML(item.title)}</strong><small>${escapeHTML(item.meta)}</small></a>`;
        }

        function findResults(query) {
          const normalized = query.trim().toLowerCase();
          if (!normalized) return [];
          return allSearchable
            .filter((item) =>
              `${item.title} ${item.meta} ${item.description}`
                .toLowerCase()
                .includes(normalized),
            )
            .slice(0, 8);
        }

        function clearValidation(form) {
          form
            .querySelectorAll("[aria-invalid='true']")
            .forEach((field) => field.removeAttribute("aria-invalid"));
          form
            .querySelectorAll(".form-error")
            .forEach((error) => error.remove());
        }

        function updateSearchResults(query, target) {
          if (!target) return;
          target.innerHTML =
            '<p class="search-loading">Searching the local library…</p>';
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => {
            const results = findResults(query);
            target.innerHTML = results.length
              ? results.map(resultMarkup).join("")
              : `<div class="search-empty"><strong>No page matches “${escapeHTML(query || "that phrase")}”.</strong>Try a broader word such as <em>ownership</em>, <em>architecture</em>, or <em>Blueprint</em>.</div>`;
          }, 180);
        }

        function openSearch() {
          searchModalPreviousFocus = document.activeElement;
          searchModal.hidden = false;
          updateSearchResults(modalSearchInput.value, modalResults);
          window.setTimeout(() => modalSearchInput.focus(), 0);
        }

        function closeSearch() {
          searchModal.hidden = true;
          searchModalPreviousFocus?.focus?.();
        }

        function openNewsletter() {
          utilityModal.hidden = false;
          utilityContent.innerHTML = `<div class="modal-header"><div><span class="utility-label">Newsletter</span><h2 id="utility-title">One useful note at a time.</h2></div><button class="icon-button" type="button" data-action="close-utility" aria-label="Close newsletter">${icon("close")}</button></div><p>Occasional notes on business architecture, AI, and the work around software. This is a local preview; no email is sent.</p><form class="modal-form" id="newsletter-form" novalidate><div class="form-field"><label for="newsletter-email">Email address</label><input id="newsletter-email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required /></div><button class="button-primary" type="submit">Join the preview list ${icon("arrow")}</button></form><p class="offline-note">Success state: the preview will acknowledge a valid address without creating a subscription.</p>`;
          window.setTimeout(
            () => document.getElementById("newsletter-email")?.focus(),
            0,
          );
          document
            .getElementById("newsletter-form")
            ?.addEventListener("submit", (event) => {
              event.preventDefault();
              const form = event.currentTarget;
              clearValidation(form);
              if (!form.checkValidity()) {
                const input = form.querySelector("input");
                input?.setAttribute("aria-invalid", "true");
                if (!form.querySelector(".form-error"))
                  input?.insertAdjacentHTML(
                    "afterend",
                    '<p class="form-error">Enter a valid email address.</p>',
                  );
                showToast("Enter a valid email address to continue.");
                return;
              }
              utilityContent.insertAdjacentHTML(
                "beforeend",
                '<p class="form-feedback">You are on the preview list. The real product would now confirm the subscription.</p>',
              );
              showToast("Newsletter success state shown.");
            });
        }

        function closeUtility() {
          utilityModal.hidden = true;
        }

        function bindPageForms() {
          const accountForm = document.getElementById("account-form");
          if (accountForm) {
            accountForm.addEventListener("submit", (event) => {
              event.preventDefault();
              const input = accountForm.querySelector("input");
              clearValidation(accountForm);
              if (!accountForm.checkValidity()) {
                input?.setAttribute("aria-invalid", "true");
                if (!accountForm.querySelector(".form-error"))
                  input?.insertAdjacentHTML(
                    "afterend",
                    '<p class="form-error">Enter a valid email address before continuing.</p>',
                  );
                showToast(
                  "Enter a valid email address to see the success state.",
                );
                return;
              }
              if (
                !accountForm.nextElementSibling?.classList.contains(
                  "form-feedback",
                )
              )
                accountForm.insertAdjacentHTML(
                  "afterend",
                  '<p class="form-feedback">Preview success: a magic link would return you to the page you meant to open.</p>',
                );
            });
          }

          const helpForm = document.getElementById("help-form");
          if (helpForm) {
            helpForm.addEventListener("submit", (event) => {
              event.preventDefault();
              clearValidation(helpForm);
              const fields = [...helpForm.querySelectorAll("input, textarea")];
              if (!helpForm.checkValidity()) {
                fields
                  .filter((field) => !field.value.trim())
                  .forEach((field) => {
                    field.setAttribute("aria-invalid", "true");
                    if (
                      !field.nextElementSibling?.classList.contains(
                        "form-error",
                      )
                    )
                      field.insertAdjacentHTML(
                        "afterend",
                        '<p class="form-error">Add this detail so the note can be handed off.</p>',
                      );
                  });
                showToast("Add the route and a short description first.");
                return;
              }
              if (
                !helpForm.nextElementSibling?.classList.contains(
                  "form-feedback",
                )
              )
                helpForm.insertAdjacentHTML(
                  "afterend",
                  '<p class="form-feedback">Preview success: the support note is ready to hand off when the connection returns.</p>',
                );
            });
          }

          const pageSearchForm = document.getElementById("page-search-form");
          if (pageSearchForm) {
            pageSearchForm.addEventListener("submit", (event) => {
              event.preventDefault();
              const value =
                pageSearchForm.querySelector("input")?.value.trim() || "";
              location.hash = `/search?query=${encodeURIComponent(value)}`;
            });
          }
        }

        document.addEventListener("click", (event) => {
          const action = event.target.closest("[data-action]")?.dataset.action;
          if (!action) return;
          if (action === "toggle-sidebar") {
            if (window.matchMedia("(max-width: 900px)").matches) closeDrawer();
            else toggleSidebar();
          }
          if (action === "toggle-group")
            toggleGroup(event.target.closest("[data-action]").dataset.group);
          if (action === "open-drawer") openDrawer();
          if (action === "close-drawer") closeDrawer();
          if (action === "search") openSearch();
          if (action === "close-search") closeSearch();
          if (action === "newsletter") openNewsletter();
          if (action === "close-utility") closeUtility();
          if (action === "theme")
            setTheme(theme === "light" ? "dark" : "light");
        });

        document.addEventListener("click", (event) => {
          const link = event.target.closest('a[href^="#"]');
          if (link && window.matchMedia("(max-width: 900px)").matches)
            closeDrawer();
        });

        drawerBackdrop.addEventListener("click", closeDrawer);
        searchModal.addEventListener("click", (event) => {
          if (event.target === searchModal) closeSearch();
        });
        utilityModal.addEventListener("click", (event) => {
          if (event.target === utilityModal) closeUtility();
        });
        modalSearchInput.addEventListener("input", () =>
          updateSearchResults(modalSearchInput.value, modalResults),
        );
        document
          .getElementById("modal-search-form")
          .addEventListener("submit", (event) => {
            event.preventDefault();
            const query = modalSearchInput.value.trim();
            closeSearch();
            location.hash = `/search?query=${encodeURIComponent(query)}`;
          });

        window.addEventListener("hashchange", () => {
          renderPage();
          window.scrollTo(0, 0);
          main.focus({ preventScroll: true });
        });

        window.addEventListener("resize", () => {
          const isMobileViewport =
            window.matchMedia("(max-width: 900px)").matches;
          if (isMobileViewport === wasMobileViewport) return;
          wasMobileViewport = isMobileViewport;
          closeDrawer();
          renderSidebar(currentRoute().path);
        });

        window.addEventListener("keydown", (event) => {
          if (
            (event.metaKey || event.ctrlKey) &&
            event.key.toLowerCase() === "k"
          ) {
            event.preventDefault();
            openSearch();
          }
          if (event.key === "Escape") {
            if (!searchModal.hidden) closeSearch();
            else if (!utilityModal.hidden) closeUtility();
            else if (drawerOpen) closeDrawer();
          }
        });

        document.documentElement.dataset.theme = theme;
        renderPage();
      })();
    </script>
  </body>
</html>
