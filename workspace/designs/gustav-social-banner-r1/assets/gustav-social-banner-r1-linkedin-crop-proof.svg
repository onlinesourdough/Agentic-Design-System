<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">LinkedIn desktop crop and avatar proof</title>
  <desc id="desc">The exact LinkedIn banner rendered at 1128 by 282 with a simulated lower-left avatar, outer crop guard, and outlined copy-safe area.</desc>
  <defs>
    <style>
      @font-face { font-family: "Geist ADS"; src: url("fonts/geist-sans-variable.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Geist Mono ADS"; src: url("fonts/geist-mono-variable.woff2") format("woff2"); font-weight: 100 900; }
      .sans { font-family: "Geist ADS", Arial, sans-serif; }
      .mono { font-family: "Geist Mono ADS", monospace; }
    </style>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#fffaf1" stroke-opacity="0.42" stroke-width="4"/>
    </pattern>
  </defs>
  <rect width="1440" height="720" fill="#efe4d4"/>
  <text x="156" y="74" class="mono" font-size="15" font-weight="700" letter-spacing="2" fill="#bd6435">LINKEDIN · DESKTOP CROP PROOF</text>
  <text x="156" y="113" class="sans" font-size="30" font-weight="700" letter-spacing="-0.7" fill="#2b1b12">Exact source, rendered at observed profile width</text>
  <text x="156" y="145" class="sans" font-size="16" font-weight="480" fill="#6f5b4c">1584×396 source → 1128×282 display · avatar and copy overlays are proof-only</text>

  <rect x="140" y="174" width="1160" height="452" rx="22" fill="#fffaf1" stroke="#d9c8b2"/>
  <image href="gustav-social-banner-r1-linkedin.png" x="156" y="190" width="1128" height="282"/>
  <rect x="201" y="235" width="1038" height="192" fill="none" stroke="#2b1b12" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="7 7"/>
  <rect x="647" y="237" width="598" height="199" rx="7" fill="#356d55" fill-opacity="0.035" stroke="#356d55" stroke-width="2"/>
  <rect x="156" y="472" width="1128" height="138" fill="#fffaf1"/>

  <circle cx="289" cy="477" r="88" fill="#fffaf1" stroke="#fffaf1" stroke-width="12"/>
  <circle cx="289" cy="477" r="78" fill="#d9672e"/>
  <circle cx="289" cy="477" r="78" fill="url(#hatch)"/>
  <text x="289" y="483" text-anchor="middle" class="mono" font-size="13" font-weight="750" letter-spacing="1.5" fill="#fffaf1">AVATAR</text>

  <path d="M308 548H542" stroke="#d9c8b2" stroke-width="13" stroke-linecap="round"/>
  <path d="M308 577H462" stroke="#e6d8c6" stroke-width="9" stroke-linecap="round"/>
  <text x="936" y="224" class="mono" font-size="11" font-weight="720" letter-spacing="1.2" fill="#356d55">COPY SAFE</text>
  <text x="205" y="224" class="mono" font-size="11" font-weight="720" letter-spacing="1.2" fill="#2b1b12">4% EDGE GUARD</text>
  <path d="M265 383V340H415" fill="none" stroke="#d9672e" stroke-width="2"/>
  <text x="424" y="345" class="mono" font-size="11" font-weight="720" letter-spacing="1" fill="#d9672e">LOWER-LEFT MAY BE COVERED</text>
  <text x="156" y="672" class="mono" font-size="13" font-weight="650" letter-spacing="1.1" fill="#6f5b4c">PASS CONDITION · ALL PUBLIC COPY AND GUSTAVONLINE.COM REMAIN OUTSIDE AVATAR OCCLUSION</text>
</svg>
