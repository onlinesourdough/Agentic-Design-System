<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Gustav Online X header</title>
  <desc id="desc">Warm paper workbench with an incomplete modular field at left and the promise Byg en virksomhed, der ikke venter på dig in the clear right safe area.</desc>
  <metadata>
    ADS run gustav-social-banner-r1; revision r1; 1500x500.
    Background seed SHA-256 055b90690a5db1c545e5608269d0f144ec0b4022c3c27c02d7a8db2e26eedfef.
    Final image-generation prompt: none; deterministic SVG and Chrome raster export.
  </metadata>
  <defs>
    <style>
      @font-face { font-family: "Geist ADS"; src: url("fonts/geist-sans-variable.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "Geist Mono ADS"; src: url("fonts/geist-mono-variable.woff2") format("woff2"); font-weight: 100 900; }
      .sans { font-family: "Geist ADS", Arial, sans-serif; }
      .mono { font-family: "Geist Mono ADS", monospace; }
    </style>
    <linearGradient id="quiet" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fbf4e8" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#fbf4e8" stop-opacity="0.22"/>
      <stop offset="0.56" stop-color="#fbf4e8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fbf4e8"/>
    </linearGradient>
  </defs>

  <rect width="1500" height="500" fill="#fbf4e8"/>
  <image href="gustav-social-banner-r1-background-seed.png" x="0" y="0" width="1500" height="500" preserveAspectRatio="none"/>
  <rect width="1500" height="500" fill="url(#quiet)"/>

  <path d="M125 109H495Q510 109 510 124V190Q510 205 495 205H340" fill="none" stroke="#bd6435" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="340" cy="205" r="5" fill="#bd6435"/>
  <rect x="309" y="155" width="66" height="67" rx="15" fill="#fbf4e8" fill-opacity="0.08" stroke="#bd6435" stroke-width="2"/>

