  </g>
  <g aria-label="Gustav Online public front door">
    <text x="175" y="108" text-anchor="middle" class="sans" font-size="21" font-weight="760" letter-spacing="-0.8" fill="#fffaf1">G/O</text>
    <text x="175" y="132" text-anchor="middle" class="mono" font-size="7.5" font-weight="690" letter-spacing="1.1" fill="#fffaf1">PUBLIC</text>
  </g>
  <text x="259" y="130" text-anchor="middle" class="mono" font-size="8" font-weight="720" letter-spacing="1" fill="#2b1b12">OFFER</text>
  <text x="343" y="130" text-anchor="middle" class="mono" font-size="8" font-weight="720" letter-spacing="1" fill="#fffaf1">OPS</text>
  <text x="428" y="130" text-anchor="middle" class="mono" font-size="8" font-weight="720" letter-spacing="0.8" fill="#2b1b12">DEMAND</text>

  <g aria-label="AIOS bounded proof tile">
    <rect x="141" y="155" width="68" height="69" rx="14" fill="#17334a" fill-opacity="0.96"/>
    <path d="M158 176H191M158 183H183M158 190H194" stroke="#84dce8" stroke-width="2" stroke-linecap="round"/>
