  </g>

  <g fill="#2b1b12">
    <text x="720" y="117" class="mono" font-size="20" font-weight="680" letter-spacing="2.3">FOR FOUNDER-LED VIRKSOMHEDER</text>
    <text x="720" y="180" class="sans" font-size="61" font-weight="720" letter-spacing="-2.7">Byg en virksomhed,</text>
    <text x="720" y="240" class="sans" font-size="61" font-weight="720" letter-spacing="-2.7">der ikke venter på dig.</text>
    <text x="720" y="323" class="sans" font-size="26" font-weight="520" letter-spacing="-0.24">Enklere arbejde · ansvarlig AI ·</text>
    <text x="720" y="356" class="sans" font-size="26" font-weight="520" letter-spacing="-0.24">software du kan forstå og eje</text>
    <text x="720" y="421" class="mono" font-size="22" font-weight="680" letter-spacing="0.6">gustavonline.com</text>
