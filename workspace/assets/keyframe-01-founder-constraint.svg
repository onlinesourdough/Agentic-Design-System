<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The founder-owned Demand queue</title>
  <desc id="desc">Gustav on an orange human field beside a warm paper field where visual choice, version, production, and approval collect on one Demand constraint line.</desc>
  <defs>
    <clipPath id="portrait-clip">
      <path d="M0 0h760v900H0z" />
    </clipPath>
    <linearGradient id="portrait-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F36F2B" stop-opacity=".18" />
      <stop offset=".72" stop-color="#F36F2B" stop-opacity=".64" />
      <stop offset="1" stop-color="#AF441D" stop-opacity=".86" />
    </linearGradient>
    <filter id="paper-shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#2B1B12" flood-opacity=".13" />
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#F36F2B" />
  <g clip-path="url(#portrait-clip)">
    <image href="gustav-portrait.jpg" x="0" y="0" width="760" height="900" preserveAspectRatio="xMidYMid slice" />
    <rect width="760" height="900" fill="url(#portrait-wash)" />
    <rect x="54" y="58" width="258" height="34" rx="4" fill="#FFF8EB" />
    <text x="72" y="81" fill="#2B1B12" font-family="ui-monospace, monospace" font-size="15" font-weight="700" letter-spacing="2.1">GUSTAV ONLINE / DEMAND</text>
    <text x="58" y="760" fill="#FFF8EB" font-family="Arial, sans-serif" font-size="23" font-weight="650">Human voice. Public learning.</text>
    <text x="58" y="796" fill="#FFF8EB" font-family="Arial, sans-serif" font-size="23">The useful material already exists.</text>
  </g>
  <path d="M708 0H1600V900H660L722 720L680 520L742 320Z" fill="#F8F2E8" />
  <text x="834" y="150" fill="#806C5C" font-family="ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="2.4">00:04 / THE CONSTRAINT</text>
  <text x="834" y="236" fill="#2B1B12" font-family="Arial, sans-serif" font-size="65" font-weight="720" letter-spacing="-3.2">
    <tspan x="834" dy="0">The useful idea</tspan>
    <tspan x="834" dy="70">is here.</tspan>
  </text>
  <text x="834" y="404" fill="#5A3D30" font-family="Arial, sans-serif" font-size="43" font-weight="580" letter-spacing="-1.8">
    <tspan x="834" dy="0">The content still</tspan>
    <tspan x="834" dy="50">waits for Gustav.</tspan>
  </text>
  <path d="M760 609H1518" stroke="#B86F36" stroke-width="7" stroke-linecap="round" />
  <circle cx="773" cy="609" r="16" fill="#B86F36" />
  <circle cx="1518" cy="609" r="10" fill="#2B1B12" />
  <g filter="url(#paper-shadow)" font-family="ui-monospace, monospace" font-size="15" font-weight="700" letter-spacing="1.3">
    <g transform="translate(826 553) rotate(-3)">
      <rect width="152" height="84" rx="6" fill="#FFFDF7" stroke="#DECDB8" />
      <text x="19" y="50" fill="#5A3D30">VISUAL CHOICE</text>
    </g>
    <g transform="translate(992 542) rotate(2)">
      <rect width="124" height="91" rx="6" fill="#FFFDF7" stroke="#DECDB8" />
      <text x="22" y="52" fill="#5A3D30">VERSION</text>
    </g>
    <g transform="translate(1133 553) rotate(-1)">
      <rect width="154" height="84" rx="6" fill="#FFFDF7" stroke="#DECDB8" />
      <text x="20" y="50" fill="#5A3D30">PRODUCTION</text>
    </g>
    <g transform="translate(1302 541) rotate(3)">
      <rect width="139" height="92" rx="6" fill="#FFFDF7" stroke="#DECDB8" />
      <text x="18" y="53" fill="#5A3D30">APPROVAL</text>
    </g>
  </g>
  <text x="834" y="720" fill="#806C5C" font-family="Arial, sans-serif" font-size="20">Four repeated decisions. One founder-owned queue.</text>
  <rect x="834" y="761" width="490" height="1" fill="#DECDB8" />
  <text x="834" y="808" fill="#2B1B12" font-family="ui-monospace, monospace" font-size="15" font-weight="700" letter-spacing="1.5">CURRENT CONSTRAINT / DEMAND CONTENT PRODUCTION</text>
</svg>

