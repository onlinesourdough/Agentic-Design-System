<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">The work waited for me</title>
  <desc id="description">Gustav in a candid elevator portrait beside a large founder bottleneck statement and three small queue labels converging on one ME node.</desc>
  <defs>
    <linearGradient id="photo-wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b1b12" stop-opacity="0.06" />
      <stop offset="0.68" stop-color="#2b1b12" stop-opacity="0.22" />
      <stop offset="1" stop-color="#2b1b12" stop-opacity="0.82" />
    </linearGradient>
    <linearGradient id="orange-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f36f2b" stop-opacity="0.92" />
      <stop offset="1" stop-color="#b86f36" stop-opacity="0.82" />
    </linearGradient>
    <pattern id="paper-lines" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#fffaf1" stroke-opacity="0.032" stroke-width="1" />
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#150d09" flood-opacity="0.22" />
    </filter>
    <style>
      @font-face { font-family: "Geist Sans"; src: url("fonts/geist-sans-variable.woff2") format("woff2"); }
      @font-face { font-family: "Geist Mono"; src: url("fonts/geist-mono-variable.woff2") format("woff2"); }
      .display { font-family: "Geist Sans", Arial, sans-serif; font-weight: 770; letter-spacing: -5.8px; }
      .mono { font-family: "Geist Mono", monospace; font-weight: 700; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#2b1b12" />
  <rect width="1280" height="720" fill="url(#paper-lines)" />

  <g aria-label="Owner portrait">
    <image href="gustav-portrait.jpg" x="0" y="0" width="620" height="720" preserveAspectRatio="xMidYMid slice" />
    <rect x="0" y="0" width="620" height="720" fill="url(#photo-wash)" />
    <rect x="0" y="0" width="18" height="720" fill="url(#orange-edge)" />
    <path d="M 544 0 L 638 0 L 596 720 L 500 720 Z" fill="#2b1b12" />
    <path d="M 553 0 L 564 0 L 519 720 L 508 720 Z" fill="#f36f2b" opacity="0.9" />
  </g>

  <g class="mono" font-size="15" fill="#fffaf1">
    <rect x="48" y="48" width="190" height="38" rx="7" fill="#2b1b12" fill-opacity="0.88" stroke="#fffaf1" stroke-opacity="0.28" />
    <text x="66" y="73">GUSTAV ONLINE</text>
    <circle cx="260" cy="67" r="5" fill="#f36f2b" />
    <text x="278" y="73" fill="#fffaf1" fill-opacity="0.78">DEMAND</text>
  </g>

  <g class="display" font-size="104" fill="#fffaf1">
    <text x="622" y="181">THE WORK</text>
    <text x="622" y="296" fill="#f36f2b">WAITED</text>
    <text x="622" y="411">FOR ME</text>
  </g>

  <g class="mono" font-size="15">
    <text x="624" y="478" fill="#fffaf1" fill-opacity="0.68">FOUNDER QUEUE · IDEAS WERE READY</text>
    <path d="M 624 579 H 1162" fill="none" stroke="#b86f36" stroke-width="5" stroke-linecap="round" />
    <path d="M 772 569 L 789 579 L 772 589" fill="none" stroke="#f36f2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 918 569 L 935 579 L 918 589" fill="none" stroke="#f36f2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

    <g filter="url(#soft-shadow)">
      <rect x="624" y="510" width="132" height="44" rx="8" fill="#fffdf7" transform="rotate(-1 690 532)" />
      <text x="649" y="538" fill="#2b1b12">VISUAL</text>
      <rect x="777" y="510" width="132" height="44" rx="8" fill="#efe4d4" transform="rotate(1.2 843 532)" />
      <text x="794" y="538" fill="#2b1b12">VERSION</text>
      <rect x="930" y="510" width="142" height="44" rx="8" fill="#fffdf7" transform="rotate(-0.7 1001 532)" />
      <text x="944" y="538" fill="#2b1b12">APPROVAL</text>
    </g>

    <circle cx="1162" cy="579" r="43" fill="#f36f2b" />
    <circle cx="1162" cy="579" r="35" fill="#2b1b12" stroke="#fffaf1" stroke-width="2" />
    <text x="1147" y="585" fill="#fffaf1" font-size="17">ME</text>
  </g>

  <path d="M 48 672 H 1012" stroke="#fffaf1" stroke-opacity="0.16" stroke-width="1" />
  <text x="48" y="695" class="mono" font-size="13" fill="#fffaf1" fill-opacity="0.58">01 / WHY THE WORK KEPT WAITING FOR ME</text>
</svg>
