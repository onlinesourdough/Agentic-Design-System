<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Design-template workflow</title>
  <desc id="desc">A brief moves through design, preview, review, and handoff before Solution-template or PowerBI-template takes ownership.</desc>
  <rect width="1600" height="760" rx="42" fill="#f3efe6"/>
  <path d="M90 128H1510" stroke="#d8d1c3" stroke-width="2" stroke-dasharray="7 12"/>
  <text x="90" y="84" fill="#756f62" font-family="ui-monospace,monospace" font-size="22" letter-spacing="3">ONLINESOURDOUGH · DESIGN-TEMPLATE</text>
  <text x="90" y="190" fill="#25241f" font-family="ui-sans-serif,system-ui" font-size="66" font-weight="750" letter-spacing="-3">See the bake before you build it.</text>
  <g font-family="ui-sans-serif,system-ui">
    <g transform="translate(90 280)"><rect width="235" height="210" rx="26" fill="#fffdf8" stroke="#d8d1c3" stroke-width="2"/><text x="28" y="48" fill="#e4572e" font-size="18" font-weight="700">01 · BRIEF</text><text x="28" y="101" fill="#25241f" font-size="31" font-weight="700">Real need</text><text x="28" y="138" fill="#666257" font-size="19">Audience, action,</text><text x="28" y="166" fill="#666257" font-size="19">constraints and proof.</text></g>
    <g transform="translate(385 280)"><rect width="235" height="210" rx="26" fill="#fffdf8" stroke="#d8d1c3" stroke-width="2"/><text x="28" y="48" fill="#e4572e" font-size="18" font-weight="700">02 · DESIGN</text><text x="28" y="101" fill="#25241f" font-size="31" font-weight="700">Direction</text><text x="28" y="138" fill="#666257" font-size="19">Tokens, hierarchy</text><text x="28" y="166" fill="#666257" font-size="19">and states.</text></g>
    <g transform="translate(680 280)"><rect width="235" height="210" rx="26" fill="#fffdf8" stroke="#d8d1c3" stroke-width="2"/><text x="28" y="48" fill="#e4572e" font-size="18" font-weight="700">03 · PREVIEW</text><text x="28" y="101" fill="#25241f" font-size="31" font-weight="700">Taste it</text><text x="28" y="138" fill="#666257" font-size="19">Browser, mobile</text><text x="28" y="166" fill="#666257" font-size="19">and keyboard.</text></g>
    <g transform="translate(975 280)"><rect width="235" height="210" rx="26" fill="#fffdf8" stroke="#d8d1c3" stroke-width="2"/><text x="28" y="48" fill="#e4572e" font-size="18" font-weight="700">04 · REVIEW</text><text x="28" y="101" fill="#25241f" font-size="31" font-weight="700">Proof it</text><text x="28" y="138" fill="#666257" font-size="19">Useful, original</text><text x="28" y="166" fill="#666257" font-size="19">and complete.</text></g>
    <g transform="translate(1270 280)"><rect width="240" height="210" rx="26" fill="#2f5d50"/><text x="28" y="48" fill="#f3c98b" font-size="18" font-weight="700">05 · HANDOFF</text><text x="28" y="101" fill="#ffffff" font-size="31" font-weight="700">Ready to bake</text><text x="28" y="138" fill="#dfeae5" font-size="19">Portable files.</text><text x="28" y="166" fill="#dfeae5" font-size="19">No runtime tie.</text></g>
  </g>
  <g fill="none" stroke="#e4572e" stroke-width="4" stroke-linecap="round"><path d="M326 385H374"/><path d="M621 385H669"/><path d="M916 385H964"/><path d="M1211 385H1259"/></g>
  <g fill="#e4572e"><path d="m374 385-13-8v16z"/><path d="m669 385-13-8v16z"/><path d="m964 385-13-8v16z"/><path d="m1259 385-13-8v16z"/></g>
  <path d="M1390 510V595H510" fill="none" stroke="#2f5d50" stroke-width="3" stroke-linecap="round"/>
  <path d="m510 595 14-9v18z" fill="#2f5d50"/>
  <rect x="90" y="555" width="340" height="90" rx="22" fill="#f3c98b"/>
  <text x="118" y="593" fill="#533a20" font-family="ui-sans-serif,system-ui" font-size="18" font-weight="700">NEXT OWNER</text>
  <text x="118" y="624" fill="#533a20" font-family="ui-sans-serif,system-ui" font-size="23">Solution-template or PowerBI-template</text>
  <text x="90" y="708" fill="#756f62" font-family="ui-sans-serif,system-ui" font-size="20">The recipe travels. The workbench stays behind.</text>
</svg>
